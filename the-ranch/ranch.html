<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Ranch</title>
<link rel="stylesheet" href="ranch.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="signs"></div>
  <header id="bar">
    <button id="todayBtn" class="chip" aria-expanded="false">Today <span id="todayCount">0 of 4</span></button>
    <div class="spacer"></div>
    <button id="speedBtn" class="chip" aria-pressed="false" title="Make time go faster">1×</button>
    <button id="homeBtn" class="chip" title="See the whole ranch">Whole ranch</button>
  </header>
  <section id="today" hidden>
    <h2>Today's work</h2>
    <ol id="todayList"></ol>
    <p class="fine">Tap a sign on the map to go there. Tap a cow to look her over.</p>
  </section>
  <section id="sheet" hidden>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" class="x" aria-label="Close">×</button></div>
    <p id="sheetText"></p>
    <div id="sheetBtns"></div>
  </section>
  <div id="hint">Drag to move around. Pinch or scroll to zoom in. Twist with two fingers to turn.</div>
  <div id="loading">Loading the ranch…</div>
</div>
<script src="../animal-3d-models/vendor/three.r128.min.js"></script>
<script src="../animal-3d-models/viewer/cinema.js"></script>
<script src="../animal-3d-models/zebu-cattle/zebu.js"></script>
<script src="../animal-3d-models/zebu-cattle/zebu-moves.js"></script>
<script src="../animal-3d-models/zebu-cattle/zebu-hd.js"></script>
<script src="../animal-3d-models/viewer/land-kit.js"></script>
<script src="map/trace.js"></script>
<script src="ranch-land.js"></script>
<script src="ranch.js"></script>
</body>
</html>
