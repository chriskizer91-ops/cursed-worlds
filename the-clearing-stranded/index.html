    tools.filter(x => x[0]).map(([, i, n, c]) => `<div><span>${i}</span>${esc(n)}<b>${c ? c : ''}</b></div>`).join('') + '</div></div>';
  return h;
}

/* ---------- craft: a short list sorted by how close each thing is, with one-tap Make ---------- */
function recipeTime(r){
  if (r.total) return durLabel(r.hours) + ' a session, ' + durLabel(r.total) + ' in all';
  return durLabel(r.hours);
}
function recRow(r, bucket){
  const pinned = S.pin === r.id;
  let st = '', meter = '';
  if (bucket === 'built') st = r.count ? 'You have ' + r.count + '.' : 'Built.';
  else if (bucket === 'prog'){ st = Math.round(r.prog * 100) + '% done. ' + (r.status === 'ok' ? durLabel(r.hours) + ' for the next session.' : r.why); meter = `<div class="meter"><i style="width:${Math.round(r.prog * 100)}%"></i></div>`; }
  else if (bucket === 'ready') st = 'Ready. Takes ' + recipeTime(r) + '.' + (r.count ? ' You have ' + r.count + '.' : '');
  else if (bucket === 'locked') st = 'First: ' + r.prereq.filter(p => !p.met).map(p => p.label).join('; ') + '.';
  else { const p = E.plan(S, r.id); st = p ? p.text : r.why; }
  const make = r.status === 'ok' && bucket !== 'built'
    ? `<button type="button" class="btn hot" data-craft="${r.id}">${r.started ? 'Keep working' : 'Make'}</button>`
    : `<span class="chev" aria-hidden="true">›</span>`;
  return `<div class="rec${pinned ? ' pinned' : ''}${bucket === 'locked' ? ' locked' : ''}"><button type="button" class="rec-main" data-crecipe="${r.id}" aria-label="${esc(r.name)}: see the plan"><span class="ic">${r.icon}</span><span><span class="nm">${esc(r.name)}</span><span class="st">${esc(st)}</span>${meter}</span></button>${make}</div>`;
}
function craftTab(){
  const groups = ['All'].concat(D.GROUPS);
  const all = E.recipes(S).filter(r => craftGroup === 'All' || r.group === craftGroup);
  const B = {prog: [], ready: [], need: [], locked: [], built: []};
  for (const r of all){
    if (r.status === 'done') B.built.push(r);
    else if (r.started) B.prog.push(r);
    else if (r.status === 'ok') B.ready.push(r);
    else if (r.prereq.some(p => !p.met)) B.locked.push(r);
    else B.need.push(r);
  }
  // closest to finished first: fewest kinds of material still missing
  const missing = r => r.need.filter(n => n.have < n.n).length;
  B.need.sort((a, b) => missing(a) - missing(b));
  let h = `<div class="filters" role="group" aria-label="Kinds of project">${groups.map(g => `<button type="button" data-cgroup="${g}" aria-pressed="${craftGroup === g}">${g}</button>`).join('')}</div>`;
  h += `<p class="note">${S.loc === 'camp' ? 'Tap any project to see what it needs and where to find it.' : 'Cordage and small tools can be made anywhere. Everything else gets built at camp. Tap a project to see what it needs.'}</p>`;
  const sect = (title, list, bucket) => list.length ? `<div class="sect"><h3>${title}<span class="count">${list.length}</span></h3>${list.map(r => recRow(r, bucket)).join('')}</div>` : '';
  h += sect('In progress', B.prog, 'prog') + sect('Ready to make', B.ready, 'ready') + sect('Needs materials', B.need, 'need') + sect('Not yet', B.locked, 'locked');
  if (!B.prog.length && !B.ready.length && !B.need.length && !B.locked.length) h += '<p class="note">Everything in this group is built.</p>';
  if (B.built.length) h += `<details class="built"><summary>Built <span class="count">${B.built.length}</span></summary>${B.built.map(r => recRow(r, 'built')).join('')}</details>`;
  return h;
}

/* The plan for one recipe: what it needs, where that comes from, and the next thing to do about it. */
const PLAN_TIPS = {
  bowl: 'Boiling in the bowl also takes four dry cooking stones from the Prairie, a burning fire, and untreated water in your containers.',
  bag: 'The bag carries water but doesn\'t clean it. River water still needs boiling.',
  bowdrill: 'A fire also needs cedar bark for tinder, firewood, and a bowstring. A bootlace works for the string.',
  trap: 'Set the finished trap at the River Bank. Baited with grubs from the Cedar Stand, it catches far more.',
  rack: 'Fruit dries in the sun. Meat needs the fire burning the whole time it smokes, about 30 hours.',
  pot: 'A shaped pot has to dry under a roof for three days before you can fire it.',
  snares: 'Set snares on the Prairie or in the Oak Woods, and check them every day.',
  leach: 'Each batch turns about three pounds of bitter acorns into food.'
};
function sourceLinks(k, r){
  if (D.MAKES[k]){ const m = D.RECIPES.find(x => x.id === D.MAKES[k]); return `You make this. <button type="button" class="link" data-crecipe="${m.id}">${esc(m.name)}</button>`; }
  if (k === 'tarp') return 'Your two tarps are all the tarp there is. You have ' + fmtN(S.gear.tarp) + ' m² left.';
  const src = E.sourceOf(S, k); if (!src) return '';
  let h = esc(src.text + ' at the ' + shortPlace(src.loc) + '.') + (src.note ? ' ' + esc(src.note) : '') + ' ';
  if (S.loc === src.loc){ const a = E.actions(S).find(a => a.id === src.act); if (a) h += `<button type="button" class="link" data-act="${a.id}"${a.ok ? '' : ' disabled'}>${a.ok ? 'Do it now, ' + durLabel(a.h) : esc(a.why)}</button>`; }
  else { const t = E.travelList(S).find(x => x.id === src.loc); h += `<button type="button" class="link" data-go="${src.loc}">Walk there${t ? ', ' + t.mins + ' min' : ''}</button>`; }
  if (k === 'poles' && r.planks && S.gear.crates > 0) h += `<br>Crate planks work too, one for one. ${S.loc === 'camp' ? '<button type="button" class="link" data-act="crate">Take apart a crate, 1 h</button>' : 'Take a crate apart at camp.'}`;
  return h;
}
function openPlan(id, back){
  const r = recipeView(id); if (!r) return;
  const raw = D.RECIPES.find(x => x.id === id);
  if (!$('.sheet.plan')) planTrail = [];
  else if (!back && planOpen && planOpen !== id) planTrail.push(planOpen);
  planOpen = id;
  const done = r.status === 'done', step = E.plan(S, id), pinned = S.pin === id;
  let h = `<div class="sh-nav">${planTrail.length ? '<button type="button" class="link" data-cback>Back</button>' : '<span></span>'}<button type="button" class="link" data-close>Close</button></div>`;
  h += `<div class="plan-head"><h2>${esc(r.name)}</h2><span class="ic">${r.icon}</span></div><p class="plan-desc">${esc(r.desc)}</p>`;
  if (!done) h += `<p class="plan-meta">${esc(recipeTime(r))} of ${esc(raw.work || 'light')} work, ${r.anywhere ? 'anywhere' : 'at camp'}.${r.savings > 0 ? ` <span class="save">The workbench saves ${durLabel(r.savings)}.</span>` : ''}</p>`;
  if (r.started) h += `<div class="meter" style="margin-top:12px"><i style="width:${Math.round(r.prog * 100)}%"></i></div><p class="note">${Math.round(r.prog * 100)}% done. The materials are already in it, so you can stop and come back any time.</p>`;
  if (r.need.length){
    h += `<h3>${r.started || done ? 'What it took' : 'What it takes'}${r.started || done ? '' : '<span>have / need</span>'}</h3>`;
    h += r.need.map(n => {
      const M = D.MATS[n.k] || D.GEAR[n.k] || {}, ok = n.have >= n.n, fixed = r.started || done;
      const name = n.k === 'poles' && r.planks ? 'Cedar poles or crate planks' : n.k === 'tarp' ? 'Tarp, in m²' : (M.name || n.name);
      return `<div class="ing ${fixed ? '' : ok ? 'ok' : 'miss'}"><div class="ing-line"><span>${M.icon || (n.k === 'tarp' ? '🟦' : '▪')}</span><span class="nm">${esc(name)}</span><span class="qty">${fixed ? fmtN(n.n) : fmtN(n.have) + ' / ' + fmtN(n.n)}</span></div>${fixed || ok ? '' : `<div class="ing-src">${sourceLinks(n.k, r)}</div>`}</div>`;
    }).join('');
  }
  if (raw.give) h += `<p class="note">Makes ${Object.keys(raw.give).map(k => raw.give[k] + ' ' + unitName(k, raw.give[k])).join(', ')} each time.</p>`;
  else if (raw.count && !done) h += `<p class="note">You have ${r.count || 0} so far${raw.max ? ', and ' + raw.max + ' is plenty' : ''}.</p>`;
  if (!done){
    const pre = r.prereq.map(p => ({label: p.label, met: p.met}));
    if (!r.anywhere) pre.unshift({label: 'Be at camp, by the Boulders', met: S.loc === 'camp'});
    if (raw.fire) pre.push({label: 'A burning fire', met: S.fire.st === 'lit'});
    if (pre.length) h += '<h3>Before you start</h3><ul class="pre">' + pre.map(p => `<li class="${p.met ? 'met' : ''}"><span class="tick">${p.met ? '✓' : '○'}</span><span>${esc(p.label)}</span></li>`).join('') + '</ul>';
    if (step && !step.ready) h += `<div class="next"><div class="next-head"><span>${step.wait ? 'Nothing to do yet' : 'Next step'}</span></div><p class="next-how" style="margin-top:3px;color:var(--ink)">${esc(step.text)}</p><div class="next-actions">${stepButtons(step, true)}</div></div>`;
  }
  if (PLAN_TIPS[id]) h += `<p class="tip">${esc(PLAN_TIPS[id])}</p>`;
  h += '<div class="foot">' + (done ? '' : `<button type="button" class="link" data-cpin="${id}">${pinned ? 'Stop following this project' : 'Make this my project'}</button>`) +
    (!done && r.status === 'ok' ? `<button type="button" class="btn hot" data-craft="${id}">${r.started ? 'Keep working' : 'Make it'}, ${durLabel(r.hours)}</button>` : `<button type="button" class="btn" data-close>${done ? 'Done' : 'Close'}</button>`) + '</div>';
  openSheet(h, 'plan', false);
  const sh = $('.sheet'); if (sh) sh.scrollTop = 0;
}

/* ---------- journal ---------- */
function journalTab(){
  const gc = E.guideCount(S);
  const segs = [['log', 'Log'], ['camp', 'Camp'], ['guide', 'Guide ' + gc.found + '/' + gc.total], ['wild', 'Wildlife'], ['badges', 'Badges ' + Object.keys(S.ach).length + '/' + Object.keys(D.ACH).length]];
  let h = '<div class="seg">' + segs.map(([k, l]) => `<button type="button" data-j="${k}" aria-pressed="${jtab === k}">${esc(l)}</button>`).join('') + '</div>';
  if (jtab === 'camp') h += campView();
  else if (jtab === 'guide') h += guideView();
  else if (jtab === 'wild') h += wildView();

  else h += logView();

function campView(){
  const p = E.progression(S);
  let h = `<div class="road"><p class="road-intro">${p.complete ? 'Every milestone reached. This is a home now.' : p.completed + ' of ' + p.total + ' milestones so far. They\'re ideas, not orders: the weather and your stomach get a vote.'}</p>`;
  for (const st of p.stages){
    h += `<h3>${esc(st.name)}<span>${st.completed}/${st.total}</span></h3><p class="stage-desc">${esc(st.desc)}</p><ul>` +

function logView(){
  const L = S.log.filter(e => ['Eat', 'Drink', 'Ration bars'].indexOf(e.title) < 0).slice(-80).reverse();
  if (!L.length) return '<p class="note">Nothing yet. Everything you do gets written down here.</p>';
  return '<ul class="log">' + L.map(e => `<li><div class="t">Day ${Math.floor(e.t / 24) + 1}, ${E.clock(e.t % 24)}</div><div class="h">${esc(e.icon || '')} ${esc(e.title)}</div><p>${esc(e.lines.join(' '))}</p></li>`).join('') + '</ul>';
}
function guideView(){
  return '<div class="guide">' + E.guideList(S).map(c => `<h3>${esc(c.cat)}</h3>` +
    (c.cat === 'Missing' ? '<p class="note">Things you\'d find in our Texas that don\'t exist here. People brought them.</p>' : '') +
    c.items.map(i => i.day ? `<div class="gentry"><span class="nm">${esc(i.name)}</span>${i.sci ? `<span class="sci">${esc(i.sci)}</span>` : ''}<p>${esc(i.fact)}</p></div>` : '<div class="gentry unk"><span class="nm">Not found yet</span></div>').join('')).join('') + '</div>';
}
function spChart(e){
  const hist = e.hist, n = hist.length, ws = hist.map(x => x[2]);
  const lo = Math.min(e.w0 * 0.96, ...ws), hi = Math.max(e.w0 * 1.16, ...ws);
  const X = i => n <= 1 ? 0 : i / (n - 1) * 200, Yw = w => 58 - (w - lo) / (hi - lo) * 50;
  const pmax = Math.max(e.start * 1.25, ...hist.map(x => x[1])), Yp = p => 58 - p / pmax * 50;
  const line = f => n <= 1 ? `0,${f(hist[0]).toFixed(1)} 200,${f(hist[0]).toFixed(1)}` : hist.map((x, i) => X(i).toFixed(1) + ',' + f(x).toFixed(1)).join(' ');
  const bmax = Math.max(1, ...e.bins);
  const bins = e.bins.map((c, i) => { const bh = c / bmax * 48, w = 0.4 + 0.08 * (i + 0.5); return `<rect class="bin${w > e.w0 * 1.05 ? ' hi' : ''}" x="${(222 + i * 7.8).toFixed(1)}" y="${(58 - bh).toFixed(1)}" width="6.6" height="${bh.toFixed(1)}"/>`; }).join('');
  return `<svg viewBox="0 0 300 70" role="img" aria-label="${esc(e.name)}: average wariness ${e.pct >= 0 ? 'up' : 'down'} ${Math.abs(e.pct)} percent since you arrived"><line class="base" x1="0" x2="200" y1="${Yw(e.w0).toFixed(1)}" y2="${Yw(e.w0).toFixed(1)}"/><polyline class="pop" points="${line(x => Yp(x[1]))}"/><polyline class="spark" points="${line(x => Yw(x[2]))}"/>${bins}<text x="0" y="69">arrival</text><text x="200" y="69" text-anchor="end">now</text><text x="222" y="69">calm</text><text x="300" y="69" text-anchor="end">wary</text></svg>`;
}
function wildView(){
  let h = '<p class="eco-intro">Every month, each population breeds by the rules of Dagr\'s evolution game: a 10% chance of a mutation, and a 25% chance a mutation helps. The animals you catch are the least wary ones, so the survivors that breed are the warier ones. That\'s natural selection, and you\'re doing the selecting.</p><p class="note">Solid line: average wariness. Dashed line: population. Bars: how wary each animal is right now, from calm to wary.</p>';
  for (const e of E.ecoList(S)){
    const pct = Math.abs(e.pct) < 0.5 ? 0 : e.pct, up = pct >= 1, dn = pct <= -1;
    h += `<div class="sp"><div class="top"><span>${e.icon}</span><span class="nm">${esc(e.name)}</span><span class="pct${up ? ' up' : dn ? ' down' : ''}">${pct > 0 ? '+' : ''}${pct}% wariness</span></div>
<div class="meta">${fmt(e.pop)} now (${fmt(e.start)} when you arrived). You've taken ${fmt(e.taken)}. Mutations: ${fmt(e.good)} helpful, ${fmt(e.bad)} harmful. Mutation rate ${(e.ms * 100).toFixed(1)}%.</div>${spChart(e)}</div>`;
  }

}
function badgeView(){

}

/* ---------- sheets ---------- */
let sheetLocked = false, sheetReturnFocus = null;
function openSheet(html, cls, locked){
  if (window.World && World.closeMenu) World.closeMenu();
  const keep = sheetReturnFocus || document.activeElement;
  closeSheet(true);
  sheetReturnFocus = keep;
  sheetLocked = !!locked;
  const sc = document.createElement('div');
  sc.className = 'scrim'; sc.id = 'scrim';
  sc.innerHTML = `<div class="sheet${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true">${html}</div>`;
  sc.addEventListener('click', e => { if (e.target === sc && !sheetLocked) closeSheet(); });
  document.body.appendChild(sc);
  document.body.classList.add('noscroll');
  const heading = sc.querySelector('h2'); if (heading){ heading.id = 'sheet-heading'; sc.querySelector('.sheet').setAttribute('aria-labelledby', heading.id); }
  const f = sc.querySelector('.opt, .foot .btn.hot, .foot .btn, button');
  if (f) f.focus({preventScroll: true});
}
function closeSheet(keepFocus){
  const sc = $('#scrim'); if (sc) sc.remove();
  document.body.classList.remove('noscroll'); sheetLocked = false;
  if (!$('.sheet.plan')) planOpen = '';
  if (keepFocus) return;
  if (sheetReturnFocus && sheetReturnFocus.isConnected) sheetReturnFocus.focus({preventScroll: true});
  sheetReturnFocus = null;
}
let confirmYes = null;
function confirmSheet(title, text, yesLabel, onYes){
  confirmYes = onYes;
  openSheet(`<div class="sh-head"><h2>${esc(title)}</h2></div><div class="story"><p>${esc(text)}</p></div><div class="foot"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn hot" data-confirm>${esc(yesLabel)}</button></div>`);
}
function toast(text){
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast' + ($('#scrim') ? ' top' : ''); t.setAttribute('role', 'status'); t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, 2800);
}

  let h = `<div class="sh-head"><span class="ic">${R.icon || ''}</span><h2>${esc(R.title)}</h2><span class="dur">${esc(elapsed(R.t1 - R.t0))}</span></div>`;
  h += '<div class="story">' + R.lines.map(l => `<p>${esc(l)}</p>`).join('') + '</div>';
  if (R.gains.length) h += '<div class="gains">' + R.gains.map(gainChip).join('') + '</div>';
  h += deltas(R.delta);
  if (R.notes.length || R.ach.length){
    h += '<div class="news">' + R.notes.map(k => `<p>New in your field guide: <b>${esc(D.GUIDE[k].name)}</b></p>`).join('') +
      R.ach.map(k => `<p>🏅 Badge earned: <b>${esc(D.ACH[k].name)}</b></p>`).join('') + '</div>';
  }
  if (S.dead) h += deathBlock();
  else if (S.pending) h += encounterBlock();
  else h += '<div class="foot"><button type="button" class="btn hot" data-close>Continue</button></div>';
  openSheet(h, S.dead || S.pending ? 'danger' : '', S.dead || !!S.pending);
}
function handle(R, quiet){
  if (!R) return;
  if (R.err){ toast(R.lines[0]); return; }
  if (S.dead){ recordBest(); store.del(KEY.save); } else autosave();
  sel = null;
  sheetReturnFocus = null;
  render();
  const simple = quiet && !S.dead && !S.pending && R.lines.length <= 1 && !R.notes.length && !R.ach.length;
  if (simple){ closeSheet(); toast(R.lines[0] || R.title); }
  else showResult(R);
}
function introSheet(){
  openSheet(`<div class="sh-head"><span class="ic">🌄</span><h2>Day 1</h2></div><div class="story">${E.intro(S).map(l => `<p>${esc(l)}</p>`).join('')}</div><p class="note">The clock only moves when you do something. The Next step card always has a suggestion, and it's only a suggestion.</p><div class="foot"><button type="button" class="btn hot" data-close>Look around</button></div>`);
}
function menuSheet(){
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  openSheet(`<div class="sh-head"><span class="ic">🧭</span><h2>Menu</h2></div><div class="menu-list">
<button type="button" data-m="help">How to play<span>The basics in two minutes.</span></button>
<button type="button" data-m="export">Copy a save code<span>Keep this game, or move it to another device.</span></button>
<button type="button" data-m="import">Load a save code<span>Pick up a game from a code.</span></button>
<button type="button" data-m="theme">Switch to ${dark ? 'light' : 'dark'} mode<span>${dark ? 'Paper map colors.' : 'Easier on the eyes at night.'}</span></button>
<button type="button" data-m="gb">${window.__gb ? 'Full color' : 'Game Boy colors'}<span>${window.__gb ? 'Back to the painted colors.' : 'Four shades of green, like 1989.'}</span></button>
<button type="button" data-m="title">Title screen<span>This game stays saved on this device until you start a new one.</span></button>
</div><div class="foot"><button type="button" class="btn" data-close>Close</button></div>`);
}
function helpSheet(){
  openSheet(`<div class="sh-head"><span class="ic">📖</span><h2>How to play</h2></div><div class="help">
<p><b>Everything takes time.</b> Each action shows how long it takes, and the clock only moves when you act. Reading, planning, and looking at the map are free.</p>
<p><b>Follow the Next step card, or don't.</b> It points at the most useful thing to do and has a button that does it. Pick any project in the Craft tab as your own and the card follows that instead. Thirst, hunger, and nightfall always cut in line.</p>
<p><b>Move around.</b> Use Walk to at the bottom of Here, or switch the picture to Map and tap a place.</p>
<p><b>Water comes first.</b> You lose several liters a day, more in the heat. River and pond water can make you sick. Boiled water, rain, and springs are safe.</p>
<p><b>Then food.</b> Fifteen ration bars a day keep a person even. Make them last with berries, fish, nuts, and game. Fresh meat spoils fast unless you smoke it on a drying rack.</p>
<p><b>Build things.</b> Tap any project in Craft to see what it takes and where each material comes from. Big projects are built a session at a time, and the materials go in when you start.</p>
<p><b>Grow your camp.</b> A workbench, wood store, food cache, hearth, and lookout each make life easier. The picture of your camp shows everything you've built.</p>
<p><b>Sleep at camp.</b> A roof, a bed, and a fire that lasts until dawn mean a good night. A night in the open can be dangerous.</p>
<p><b>The animals evolve.</b> Hunt one kind hard and the survivors get warier. Watch it happen in Journal, under Wildlife.</p>
<p><b>Dagr's rules.</b> Real-world physics, and survive as long as you can.</p>
</div><div class="foot"><button type="button" class="btn hot" data-close>Got it</button></div>`);
}
function exportSheet(){
  openSheet(`<div class="sh-head"><span class="ic">💾</span><h2>Save code</h2></div><p class="note">Copy this whole code and keep it somewhere safe. Paste it into Load a save code on any device to pick up right here.</p><textarea id="code" readonly aria-label="Save code">${esc(encode(S))}</textarea><div class="foot"><button type="button" class="btn" data-close>Close</button><button type="button" class="btn hot" id="copy">Copy code</button></div>`);
  $('#copy').onclick = () => {
    const ta = $('#code'); ta.focus(); ta.select();
    const done = () => toast('Save code copied.');
    try { navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) { toast('Select the code and copy it by hand.'); } }); }
    catch (e) { try { document.execCommand('copy'); done(); } catch (e2) { toast('Select the code and copy it by hand.'); } }
  };
}
function importSheet(){
  openSheet(`<div class="sh-head"><span class="ic">📥</span><h2>Load a save code</h2></div><p class="note">Paste a save code below.${S ? ' It replaces the game you\'re playing now.' : ''}</p><textarea id="code" placeholder="Paste the code here" aria-label="Save code"></textarea><p class="why" id="codeerr" style="display:none"></p><div class="foot"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn hot" id="loadit">Load game</button></div>`);
  $('#loadit').onclick = () => {
    const s = decode($('#code').value);
    if (!s){ const e = $('#codeerr'); e.textContent = 'That code didn\'t load. Make sure you copied all of it, from the first letter to the last.'; e.style.display = 'block'; return; }
    sheetReturnFocus = null; closeSheet(); startGame(s, false); autosave(); if (!s.pending) toast('Game loaded.');
  };
}

/* ---------- input ---------- */
function setTab(t){
  tab = t; $('#game').dataset.panel = t; renderTabs(); renderPanel();
  window.scrollTo(0, 0);
}
function doCraft(id){
  const result = E.craft(S, id);
  if (result && !result.err && S.pin === id){
    const r = recipeView(id), raw = D.RECIPES.find(x => x.id === id);
    if (r.status === 'done' || (!S.proj[id] && (raw.give || raw.count))) delete S.pin;
  }
  planOpen = '';
  handle(result);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-go],[data-eat],[data-bars],[data-drink],[data-craft],[data-choose],[data-close],[data-confirm],[data-tab],[data-j],[data-loc],[data-m],[data-opt],[data-view],[data-crecipe],[data-cpin],[data-cgroup],[data-cback]');
  if (!b){
    if (sel && S && !e.target.closest('.callout')){ sel = null; renderMap(); }
    return;
  }
  if (b.disabled) return;
  const d = b.dataset;
  if (d.opt){ opt[d.opt] = d.v; store.set(KEY.opt, JSON.stringify(opt)); const y = window.scrollY; titleScreen(); window.scrollTo(0, y); return; }
  if ('confirm' in d){ const f = confirmYes; confirmYes = null; sheetReturnFocus = null; closeSheet(); if (f) f(); return; }
  if (d.m){
    const m = d.m;
    if (m === 'menu') return menuSheet();
    if (m === 'help') return helpSheet();
    if (m === 'export') return S ? exportSheet() : null;
    if (m === 'import') return importSheet();
    if (m === 'theme'){
      const cur = document.documentElement.dataset.theme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next; store.set(KEY.theme, next); closeSheet(); return;
    }
    if (m === 'gb'){ const on = !window.__gb; World.gb(on); store.set('clearing.gb.v1', on ? '1' : '0'); closeSheet(); return; }
    if (m === 'title'){ sheetReturnFocus = null; closeSheet(); return titleScreen(); }
    if (m === 'again'){ sheetReturnFocus = null; closeSheet(); return startGame(E.newGame(S ? S.opt : opt), true); }
    return;
  }
  if ('close' in d){ closeSheet(); if (S) render(); return; }
  if (!S) return;
  if (d.view){ view = d.view; store.set(KEY.view, view); sel = null; renderView(); renderMap(); return; }
  if (d.tab){ closeSheet(true); sheetReturnFocus = null; setTab(d.tab); return; }
  if (d.j){ jtab = d.j; renderPanel(); return; }
  if (d.cgroup){ craftGroup = d.cgroup; renderPanel(); return; }
  if (d.loc){
    if (b.closest('.fieldmap')){ sheetReturnFocus = null; closeSheet(); if (d.loc !== S.loc) World.goTo(d.loc); else toast('You are here.'); return; }
    sel = sel === d.loc ? null : d.loc; renderMap(); return;
  }
  if (S.pending || S.dead){ if (d.choose) return handle(E.choose(S, d.choose)); return; }
  if (d.crecipe) return openPlan(d.crecipe);
  if ('cback' in d){ const prev = planTrail.pop(); if (prev) openPlan(prev, true); return; }
  if (d.cpin){
    if (S.pin === d.cpin) delete S.pin; else S.pin = d.cpin;
    autosave(); closeSheet(); render();
    toast(S.pin ? 'The Next step card will follow this project.' : 'Back to the game\'s own suggestions.');
    return;
  }
  if (d.act) return handle(E.run(S, d.act));
  if (d.go){ if (tab !== 'here'){ tab = 'here'; $('#game').dataset.panel = 'here'; } const from = S.loc, R = E.travel(S, d.go); handle(R); if (R && !R.err){ window.scrollTo(0, 0); walkOnMap(from, S.loc); } return; }
  if (d.craft) return doCraft(d.craft);
  if (d.eat) return handle(E.eat(S, +d.eat), true);
  if (d.bars) return handle(E.eatBars(S, +d.bars), true);
  if (d.drink) return handle(E.drink(S, d.drink), true);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#scrim') && !sheetLocked){ closeSheet(); if (S) render(); }
  else if (e.key === 'Escape' && sel){ sel = null; renderMap(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-loc]')){ e.preventDefault(); e.target.closest('[data-loc]').dispatchEvent(new MouseEvent('click', {bubbles: true})); }
  if (e.key === 'Tab' && $('#scrim')){
    const nodes = Array.from($('#scrim').querySelectorAll('button:not(:disabled), input, textarea, select, [tabindex="0"]'));
    if (nodes.length){ const first = nodes[0], last = nodes[nodes.length - 1];
      if (e.shiftKey && (document.activeElement === first || !$('#scrim').contains(document.activeElement))){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !$('#scrim').contains(document.activeElement))){ e.preventDefault(); first.focus(); }
    }
  }
});

titleScreen();
})();

</script>
</body>
</html>
