<!doctype html>
<html lang="en">
<!--
  THE CLEARING. A wilderness survival game for one family. Rules by Dagr.
  One file, no build step, works offline. It is laid out in five parts so it is easy to find your way around:
    1. STYLE   how it looks.
    2. DATA    every number and every word of game content: foods, recipes, animals, weather. Change the game here.
    3. ENGINE  the rules. No screen code at all, so it can be tested headlessly. Exposes window.Engine.
    4. SCENE   the picture of where you are, painted as pixel art, and the walk: the clearing from above, walked tile by tile.
    5. SCREEN  the interface. It only ever talks to the game through Engine.* calls.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7eced" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1518" media="(prefers-color-scheme: dark)">
<meta name="description" content="Survive in a North Texas clearing in a world where people never existed. Real plants, real animals, real weather.">
<title>The Clearing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;display=swap" media="print" id="webfonts">
<script>
/* The web fonts load without holding up the first paint; if they never arrive (offline), the fallbacks stay. */
(function(){ var l = document.getElementById('webfonts'); if (!l) return; var on = function(){ l.media = 'all'; }; if (l.sheet) on(); else l.addEventListener('load', on); })();
</script>
<style>
/* THE CLEARING: interface styles.
   A surveyor's field book: cool map paper, slate ink, brown contours, and one loud color,
   blaze orange, kept for "you are here" and the thing to do next. */
:root{
  --paper:#e7eced; --paper-2:#dde5e7; --sheet:#f4f7f7; --ink:#15212b; --ink-2:#435561; --ink-3:#5d6f7a;
  --rule:#bfcbd0; --rule-2:#d3dde0;
  --map-paper:#eef2ee; --water:#2677b0; --water-tint:#b9d7e9; --contour:#b7a07c; --grass:#6f8f5e;
  --cedar:#b8d2ae; --oak:#c9dfb5; --bottom:#c3dcb4; --berry:#cdbfd9; --boulder:#5d6870; --trail:#6b5b45;
  --blaze:#e0521b; --blaze-ink:#ffffff; --blaze-text:#b93f0e;
  --hp:#cf3f3f; --hyd:#2677b0; --food:#b97d0c; --en:#3f8a2f; --sun:#f2b233;
  --warn:#8f5a0c; --bad:#b62d2d; --good:#2f7a34;
  --shadow:0 -8px 30px rgba(15,25,32,.18);
  --font-ui:"Archivo Narrow","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --font-text:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1518; --paper-2:#141c20; --sheet:#182227; --ink:#e2e9eb; --ink-2:#a9b8bf; --ink-3:#8496a0;
    --rule:#2c3a41; --rule-2:#222e34;
    --map-paper:#141d1c; --water:#4ba3da; --water-tint:#18384b; --contour:#4d4636; --grass:#6c8f5c;
    --cedar:#1f3526; --oak:#223624; --bottom:#1d3223; --berry:#30283c; --boulder:#a9b4ba; --trail:#9c8b70;
    --blaze:#ff6b35; --blaze-ink:#10161a; --blaze-text:#ff8a5c;
    --hp:#ec615e; --hyd:#4ba3da; --food:#e0a53a; --en:#6cbc57; --sun:#f2b233;
    --warn:#e0a53a; --bad:#f07070; --good:#78c878;
    --shadow:0 -8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1518; --paper-2:#141c20; --sheet:#182227; --ink:#e2e9eb; --ink-2:#a9b8bf; --ink-3:#8496a0;
  --rule:#2c3a41; --rule-2:#222e34;
  --map-paper:#141d1c; --water:#4ba3da; --water-tint:#18384b; --contour:#4d4636; --grass:#6c8f5c;
  --cedar:#1f3526; --oak:#223624; --bottom:#1d3223; --berry:#30283c; --boulder:#a9b4ba; --trail:#9c8b70;
  --blaze:#ff6b35; --blaze-ink:#10161a; --blaze-text:#ff8a5c;
  --hp:#ec615e; --hyd:#4ba3da; --food:#e0a53a; --en:#6cbc57; --sun:#f2b233;
  --warn:#e0a53a; --bad:#f07070; --good:#78c878;
  --shadow:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.35;min-height:100vh;min-height:100dvh}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blaze);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- game layout ---------- */
#game{max-width:1120px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* The HUD stays pinned, so your condition is in sight while you scroll the list of things to do. */
.hud{position:sticky;top:0;z-index:6;background:var(--paper);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1.5px solid var(--ink)}
.hud-top{display:flex;align-items:baseline;gap:10px}
.hud .when{font-weight:700;font-size:17px;white-space:nowrap}
.hud .wx{color:var(--ink-2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hud .menu{margin-left:auto;font-size:15px;font-weight:600;color:var(--ink-2);padding:4px 0 4px 10px;white-space:nowrap}
.daylight{display:flex;align-items:center;gap:10px;margin-top:5px}
.daylight .track{position:relative;flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 22%,var(--paper));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 30%,transparent)}
.daylight .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--sun);border:2px solid var(--paper);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 45%,transparent);transition:left .6s ease}
.daylight .dot.moon{background:#eee8d2}
.daylight .left{font-size:13.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:7px}
.v{display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:3px;min-width:0}
.v .lab{font-size:13.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v .num{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.v .bar{grid-column:1/-1;height:5px;background:var(--rule-2);border-radius:1px;overflow:hidden}
.v .bar i{display:block;height:100%;width:0;transition:width .6s ease}
.v.hp .bar i{background:var(--hp)} .v.hyd .bar i{background:var(--hyd)} .v.food .bar i{background:var(--food)} .v.en .bar i{background:var(--en)}
.v.low .num{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chips:empty{display:none}
.chip{font-size:13.5px;font-weight:600;padding:1px 8px;border-radius:2px;border:1px solid currentColor}
.chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}

/* The stage: a picture of where you are, or the map. One at a time on a phone, both on a wide screen. */
.stage{padding:10px 14px 0}
.stage-art{border:1.5px solid var(--ink);background:var(--map-paper);overflow:hidden;position:relative}
.stage[data-view="scene"] .mapwrap{display:none}
.stage[data-view="map"] #scene{display:none}
.stage-bar{display:flex;align-items:center;gap:12px;padding:9px 0 0}
.stage-bar h2{font-family:var(--font-text);font-weight:500;font-size:26px;line-height:1.1;letter-spacing:-.01em;flex:1;min-width:0}
.viewseg{display:flex;border:1.5px solid var(--ink);border-radius:2px;flex:none}
.viewseg button{padding:5px 13px;font-size:15px;font-weight:600;color:var(--ink-2)}
.viewseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* The scene is a canvas, painted as pixel art by the scene script, which also draws everything that moves in it and
   stills it to one picture when motion is reduced. On a dark page a daytime picture is turned down a little. */
#scene{position:relative}
.landscape{display:block;width:100%;height:auto;aspect-ratio:600/260;image-rendering:pixelated;image-rendering:crisp-edges}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .landscape.day{filter:brightness(.86)}}
:root[data-theme="dark"] .landscape.day{filter:brightness(.86)}
/* The walk: the clearing from above, walked tile by tile. Also drawn in the scene script. Under it, like a handheld's
   controls, a D-pad and A and B buttons on touch screens, or a line about the keys on a computer. */
.world{position:relative;width:100%;aspect-ratio:380/290;outline:none;overflow:hidden;background:#1d2621;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.world canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.world:focus-visible{box-shadow:inset 0 0 0 3px var(--blaze)}
.world button{font:inherit}
.wtag{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;line-height:1;padding:7px 10px;border:2px solid var(--paper);box-shadow:0 0 0 2px var(--ink);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none}
.wtag.on{opacity:1;transform:none}
.wsay{position:absolute;left:8px;right:8px;bottom:8px;background:var(--sheet);color:var(--ink);font-size:15px;line-height:1.35;padding:8px 11px;border:2px solid var(--ink);box-shadow:0 0 0 2px var(--sheet);opacity:0;transition:opacity .2s;pointer-events:none}
.wsay.on{opacity:1}
.wfield{position:absolute;right:8px;top:8px;background:var(--sheet);color:var(--ink);border:2px solid var(--ink);font-weight:600;font-size:13px;line-height:1;padding:6px 9px}
.wmenu{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - 16px);overflow:auto;background:var(--sheet);color:var(--ink);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--sheet),0 8px 22px rgba(0,0,0,.35);padding:2px 0}
.wmenu[hidden]{display:none}
.wm-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 12px 6px 14px;border-bottom:1.5px solid var(--rule)}
.wm-h b{font-size:16px}.wm-h span{font-size:13px;color:var(--ink-3)}
.wm-l button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 12px 7px 26px;position:relative;font-size:15px;color:var(--ink);background:none}
.wm-l button[aria-selected="true"]{background:var(--paper-2)}
.wm-l button[aria-selected="true"]::before{content:'\25B6';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--blaze)}
.wm-l button[aria-disabled="true"] .nm,.wm-l button[aria-disabled="true"] .hr{color:var(--ink-3)}
.wm-l .hr{font-size:13px;color:var(--ink-3);white-space:nowrap}
.wm-sub{margin:0;padding:7px 14px 6px;border-top:1.5px solid var(--rule);font-size:14px;color:var(--ink-2);min-height:1.4em}
.wpad{display:none;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 12px 12px;background:var(--paper-2);border-top:1.5px solid var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.wpad button{font:inherit}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px}
.dpad button{background:var(--ink);color:var(--paper);border-radius:7px;font-size:17px;line-height:1;touch-action:none;padding:0;text-align:center}
.dpad button.on{background:var(--ink-2)}
.dpad .dc{background:var(--ink);border-radius:4px;opacity:.85}
.ab{display:flex;gap:12px;align-items:flex-start}
.ab button{width:58px;height:58px;border-radius:50%;text-align:center;background:var(--blaze);color:var(--blaze-ink);font-weight:800;font-size:19px;touch-action:manipulation;box-shadow:0 3px 0 var(--blaze-text)}
.ab button.b{width:48px;height:48px;background:var(--ink-2);color:var(--paper);margin-top:26px;box-shadow:0 3px 0 var(--ink)}
.ab button:active{transform:translateY(2px);box-shadow:none}
.wmid{font-size:13px;line-height:1.35;color:var(--ink-3);text-align:center;min-width:0}
.wmid b{display:block;font-size:15px;color:var(--ink);margin-bottom:3px}
.whint{font-size:13px;color:var(--ink-3);margin:0}
@media (pointer:coarse),(hover:none){.wpad{display:grid}.wpad .whint{display:none}}
@media (hover:hover) and (pointer:fine){.wpad{display:block;padding:8px 12px}.wpad .dpad,.wpad .ab,.wpad .wmid{display:none}}
@media (max-width:360px){.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}.ab button{width:52px;height:52px}.ab button.b{width:44px;height:44px}}
/* The narrowest phones: the place name gets its own row above the pad instead of squeezing under B. */
@media (max-width:340px){.wpad{grid-template-columns:auto 1fr}.wmid{grid-column:1/-1;order:-1}.wmid span{display:none}.ab{justify-self:end}}
/* A phone held sideways: the header scrolls away and the map fits above the pad, so you can see yourself while you walk. */
@media (orientation:landscape) and (max-height:500px) and (max-width:899px){.hud{position:static}.world{aspect-ratio:auto;height:max(170px,calc(100vh - 150px));height:max(170px,calc(100dvh - 150px))}}
.fieldmap{border:1.5px solid var(--ink);background:var(--map-paper);margin-top:10px}
.fieldmap svg{display:block;width:100%;height:auto}

.mapwrap{position:relative;background:var(--map-paper);touch-action:manipulation}
.map{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;--oakF:#dccb9e;--oakW:#d6dcd4;--botF:#d8d0a2;--botW:#d2dbd0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map{--oakF:#3a3322;--oakW:#1c2422;--botF:#353221;--botW:#1b2421}}
:root[data-theme="dark"] .map{--oakF:#3a3322;--oakW:#1c2422;--botF:#353221;--botW:#1b2421}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map .flow{stroke:#9fd0ee;stroke-opacity:.55}}
:root[data-theme="dark"] .map .flow{stroke:#9fd0ee;stroke-opacity:.55}
.map .paper{fill:var(--map-paper)}
.map .oakwood{fill:var(--oak);transition:fill .8s}
.map .cedarwood{fill:var(--cedar)}
.map .bottom{fill:var(--bottom);transition:fill .8s}
.map .thicket{fill:var(--berry)}
.map.fall .oakwood{fill:var(--oakF)} .map.winter .oakwood{fill:var(--oakW)}
.map.fall .bottom{fill:var(--botF)} .map.winter .bottom{fill:var(--botW)}
.map .contour{fill:none;stroke:var(--contour);stroke-width:.8}
.map .contour.idx{stroke-width:1.4}
.map .clab{font-family:var(--font-ui);font-size:7px;fill:var(--contour)}
.map .tuft{fill:none;stroke:var(--grass);stroke-width:.8;stroke-linecap:round;opacity:.75}
.map .tree{fill:none;stroke:var(--grass);stroke-width:.8;opacity:.7}
.map .cedartree{fill:var(--grass);opacity:.55}
.map .reeds{fill:none;stroke:var(--grass);stroke-width:.9;stroke-linecap:round}
.map .rocks{fill:var(--boulder);opacity:.45}
.map .river-edge{fill:none;stroke:var(--water);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.map .river-fill{fill:none;stroke:var(--water-tint);stroke-width:8.4;stroke-linecap:round;stroke-linejoin:round}
.map .flood .river-edge{stroke-width:14} .map .flood .river-fill{stroke:#8a7456;stroke-width:11.4}
.map .flow{fill:none;stroke:#fff;stroke-opacity:.7;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:4 14;animation:mapflow 4.5s linear infinite}
.map .flow.b{stroke-dasharray:2.5 21;stroke-width:.9;animation-duration:6.5s}
.map .flow.creekflow{stroke-width:.7;stroke-dasharray:2 9;stroke-opacity:.8;animation-duration:3.2s}
.map .flood .flow{animation-duration:1.6s;stroke-opacity:.45}
@keyframes mapflow{to{stroke-dashoffset:-36}}
.map .walk{fill:none;stroke:var(--blaze);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1 3.5;opacity:.9}
.map .pond{fill:var(--water-tint);stroke:var(--water);stroke-width:1.3}
.map .stream{fill:none;stroke:var(--water);stroke-width:1.4;stroke-linecap:round}
.map .stream.int{stroke-dasharray:6 2 1 2;stroke-width:1.1;opacity:.8}
.map .wlab{font-family:var(--font-text);font-style:italic;font-size:10.5px;fill:var(--water)}
.map .lab{font-family:var(--font-ui);font-weight:600;font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--map-paper);stroke-width:3px;stroke-linejoin:round}
.map .lab.dim{fill:var(--ink-3);font-weight:500}
.map .trail{fill:none;stroke:var(--trail);stroke-width:1.2;stroke-dasharray:3.5 2.5;stroke-linecap:round;opacity:.9}
.map .mk{fill:var(--map-paper);stroke:var(--ink);stroke-width:1.4}
.map .mk.sel{stroke:var(--blaze);stroke-width:2.2}
.map .mk.job{fill:var(--blaze);stroke:var(--map-paper)}
.map .you{fill:var(--blaze);stroke:var(--map-paper);stroke-width:1.5}
.map .ring{fill:none;stroke:var(--blaze);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.map .boulder{fill:var(--boulder)}
.map .tarp{fill:none;stroke:var(--water);stroke-width:1.6;stroke-linecap:round}
.map .walls{fill:none;stroke:var(--boulder);stroke-width:1.2}
.map .flame{fill:var(--blaze)}
.map .smoke{fill:none;stroke:var(--ink-3);stroke-width:.9;stroke-linecap:round;opacity:.8}
.map .hit{fill:transparent;cursor:pointer}
.map .hit:focus-visible{outline:none;stroke:var(--blaze);stroke-width:2}
.map .scale rect{fill:var(--ink)}
.map .scale rect.w{fill:var(--map-paper);stroke:var(--ink);stroke-width:.6}
.map .scale text,.map .north text{font-family:var(--font-ui);font-size:7.5px;fill:var(--ink-2)}
.map .north path{fill:var(--ink-2)}
.map .wash{pointer-events:none;transition:fill .8s,opacity .8s}
.map .star{fill:#fff;pointer-events:none}
.map .rain line{stroke:var(--water);stroke-width:.8;opacity:.55}
.map .snow circle{fill:#fff;opacity:.85}
.map .weather{pointer-events:none;animation:fall 1.2s linear infinite}
.map .weather.slow{animation-duration:5s}
@keyframes fall{from{transform:translate(0,-24px)}to{transform:translate(-6px,0)}}
.callout{position:absolute;transform:translate(-50%,calc(-100% - 14px));background:var(--ink);color:var(--paper);padding:7px 10px 8px;border-radius:3px;font-size:14.5px;line-height:1.2;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2}
.callout::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.callout b{display:block;font-size:15.5px}
.callout button{margin-top:6px;display:block;width:100%;text-align:center;background:var(--blaze);color:var(--blaze-ink);font-weight:700;padding:7px 12px;border-radius:2px}
.callout.left{transform:translate(-18%,calc(-100% - 14px))} .callout.left::after{left:18%}
.callout.right{transform:translate(-82%,calc(-100% - 14px))} .callout.right::after{left:82%}
.callout.below{transform:translate(-50%,16px)}
.callout.below::after{top:-6px;bottom:auto;border:6px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.callout.right.below{transform:translate(-82%,16px)} .callout.right.below::after{left:82%}
.callout.left.below{transform:translate(-18%,16px)} .callout.left.below::after{left:18%}

/* ---------- panel ---------- */
.panel{padding:10px 14px 30px}
.place .desc{font-family:var(--font-text);font-size:16.5px;line-height:1.45;color:var(--ink-2);max-width:62ch}
.place ul{margin:8px 0 0;padding:0;list-style:none}
.place li{font-size:15.5px;color:var(--ink);padding:2px 0}

/* One voice for "what now?": the only place blaze orange appears in the panel. */
.next{margin-top:14px;border:1.5px solid var(--ink);border-left:5px solid var(--blaze);background:var(--sheet);padding:11px 13px 13px}
.next.urgent{border-color:var(--bad);border-left-color:var(--bad)}
.next-head{display:flex;align-items:baseline;gap:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.next-head .prog{margin-left:auto;font-weight:500;white-space:nowrap}
.next.urgent .next-head{color:var(--bad)}
.next-goal{font-family:var(--font-text);font-size:18px;line-height:1.35;margin-top:3px;max-width:60ch}
.next-how{font-size:15.5px;color:var(--ink-2);margin-top:5px;max-width:60ch}
.next-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.next-actions .btn{padding:9px 14px;font-size:16px;white-space:normal}
.next-actions .why{font-size:14.5px;color:var(--warn);align-self:center}

.camp{margin-top:20px;border-top:1px solid var(--rule);padding-top:8px}
.camp p{display:flex;gap:10px;font-size:15.5px;padding:3px 0}
.camp p span:first-child{width:22px;flex:none;text-align:center}
.sect{margin-top:20px}
.sect > h3{font-size:14.5px;font-weight:600;color:var(--ink-2);padding-bottom:6px;border-bottom:1px solid var(--ink);display:flex;align-items:baseline;gap:8px}
.sect > h3 .count{margin-left:auto;font-weight:500;color:var(--ink-3)}
.acts{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:30px 1fr auto;column-gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
.act .ic{font-size:19px;line-height:1;grid-row:1/3;align-self:center;text-align:center}
.act .nm{font-weight:600;font-size:17px}
.act .hr{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.act .sub{grid-column:2/4;font-size:14.5px;color:var(--ink-2);margin-top:2px}
.act.hinted .nm{color:var(--blaze-text)}
.act:not(:disabled):hover .nm,.act:not(:disabled):active .nm{color:var(--blaze-text)}
.act:disabled .nm,.act:disabled .ic{opacity:.45}
.act:disabled .sub{color:var(--ink-3)}
.go{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.go button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 2px;border-bottom:1px solid var(--rule);font-size:16px;font-weight:600}
.go button span{font-weight:400;font-size:14px;color:var(--ink-2);white-space:nowrap}
.go button:hover{color:var(--blaze-text)}
.go button.hinted{color:var(--blaze-text)}

.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;column-gap:10px;padding:10px 2px;border-bottom:1px solid var(--rule);align-items:center}
.row .ic{font-size:19px;text-align:center}
.row .nm{font-weight:600;font-size:16.5px}
.row .sub{font-size:14px;color:var(--ink-2);margin-top:1px}
.row .sub.warn{color:var(--warn)} .row .sub.bad{color:var(--bad)}
.btn{display:inline-block;font-weight:700;font-size:15px;padding:7px 14px;border:1.5px solid var(--ink);border-radius:2px;white-space:nowrap;text-align:center}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35}
.btn.hot{background:var(--blaze);border-color:var(--blaze);color:var(--blaze-ink)}
.btn.hot:hover:not(:disabled){filter:brightness(1.05);background:var(--blaze);color:var(--blaze-ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.row .btns{justify-content:flex-end;flex-wrap:nowrap}
.link{font-weight:600;font-size:15px;color:var(--blaze-text);padding:6px 0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.link:disabled{color:var(--ink-3);text-decoration:none}
.note{font-size:14.5px;color:var(--ink-2);margin-top:8px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 16px}
.grid div{display:flex;gap:8px;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--rule);font-size:15.5px}
.grid div b{margin-left:auto;font-variant-numeric:tabular-nums}
.meter{height:5px;background:var(--rule-2);margin-top:6px;border-radius:1px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}

/* ---------- craft ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:6px 12px;border:1.5px solid var(--rule);border-radius:2px;font-size:15px;font-weight:600;color:var(--ink-2)}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;border-bottom:1px solid var(--rule)}
.rec-main{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;align-items:center;padding:10px 2px;width:100%}
.rec-main .ic{font-size:19px;text-align:center}
.rec-main .nm{font-weight:700;font-size:16.5px;display:block}
.rec-main .st{font-size:14.5px;color:var(--ink-2);display:block;margin-top:1px}
.rec-main:hover .nm{color:var(--blaze-text)}
.rec.pinned .nm::after{content:" ◆";color:var(--blaze);font-size:12px;vertical-align:1px}
.rec.locked .nm,.rec.locked .ic{opacity:.55}
.rec .meter{margin:6px 0 0}
.rec .chev{color:var(--ink-3);font-size:20px;padding:0 4px 0 8px}
.built summary{cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink-2);padding:12px 0 6px;border-bottom:1px solid var(--ink);list-style:none;display:flex;gap:8px}
.built summary::-webkit-details-marker{display:none}
.built summary::after{content:"Show";margin-left:auto;font-weight:500;color:var(--ink-3)}
.built[open] summary::after{content:"Hide"}
.built .rec .nm{font-weight:600;color:var(--ink-2)}

/* plan sheet */
.plan-head{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:start}
.plan-head h2{font-family:var(--font-text);font-weight:500;font-size:26px;line-height:1.15}
.plan-head .ic{font-size:34px;line-height:1}
.plan-desc{font-family:var(--font-text);font-size:16.5px;line-height:1.45;color:var(--ink-2);margin-top:6px;max-width:60ch}
.plan-meta{font-size:15px;color:var(--ink);margin-top:8px}
.plan-meta .save{color:var(--good);font-weight:600}
.plan h3{font-size:14.5px;font-weight:600;color:var(--ink-2);margin-top:18px;padding-bottom:6px;border-bottom:1px solid var(--ink);display:flex;gap:8px}
.plan h3 span{margin-left:auto;font-weight:500;color:var(--ink-3)}
.ing{padding:9px 0;border-bottom:1px solid var(--rule)}
.ing-line{display:grid;grid-template-columns:26px minmax(0,1fr) auto;column-gap:8px;align-items:baseline}
.ing-line .nm{font-weight:600;font-size:16px}
.ing-line .qty{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.ing.ok .qty{color:var(--good)} .ing.miss .qty{color:var(--bad)}
.ing-src{margin:3px 0 0 34px;font-size:14.5px;color:var(--ink-2)}
.ing-src .link{display:inline-block;margin-right:14px}
.pre{list-style:none;margin:0;padding:0}
.pre li{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15.5px}
.pre li.met{color:var(--ink-2)}
.pre li .tick{text-align:center;font-weight:700}
.pre li.met .tick{color:var(--good)} .pre li:not(.met) .tick{color:var(--bad)}
.plan .next{margin-top:16px}
.plan .tip{margin-top:14px;font-size:15px;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:10px;max-width:60ch}

/* ---------- journal ---------- */
.seg{display:flex;gap:18px;border-bottom:1px solid var(--rule);margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 0;font-weight:600;font-size:16px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:10px 0;border-bottom:1px solid var(--rule)}
.log .t{font-size:13.5px;color:var(--ink-3)}
.log .h{font-weight:700;font-size:16px;margin-top:1px}
.log p{font-family:var(--font-text);font-size:15.5px;line-height:1.4;color:var(--ink-2);margin-top:3px;max-width:62ch}
.guide h3{font-size:15px;font-weight:700;margin:18px 0 2px}
.guide .note{margin:0 0 4px}
.gentry{padding:9px 0;border-bottom:1px solid var(--rule)}
.gentry .nm{font-weight:700;font-size:16px}
.gentry .sci{font-family:var(--font-text);font-style:italic;color:var(--ink-2);font-size:15px;margin-left:6px}
.gentry p{font-family:var(--font-text);font-size:15.5px;line-height:1.42;color:var(--ink-2);margin-top:3px;max-width:62ch}
.gentry.unk .nm{color:var(--ink-3);font-weight:500}
.eco-intro{font-family:var(--font-text);font-size:16px;line-height:1.45;color:var(--ink-2);max-width:62ch;margin:6px 0 4px}
.sp{padding:12px 0;border-bottom:1px solid var(--rule)}
.sp .top{display:flex;align-items:baseline;gap:8px}
.sp .top span:first-child{font-size:18px}
.sp .nm{font-weight:700;font-size:16.5px}
.sp .pct{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.sp .pct.up{color:var(--good)} .sp .pct.down{color:var(--bad)}
.sp .meta{font-size:14px;color:var(--ink-2);margin-top:2px}
.sp svg{display:block;width:100%;height:auto;margin-top:6px}
.sp .spark{fill:none;stroke:var(--ink);stroke-width:1.6}
.sp .pop{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 2}
.sp .base{stroke:var(--rule);stroke-width:1}
.sp .bin{fill:var(--ink-3)}
.sp .bin.hi{fill:var(--good)}
.sp text{font-family:var(--font-ui);font-size:9px;fill:var(--ink-3)}
.badge{display:grid;grid-template-columns:30px 1fr;column-gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.badge .ic{font-size:18px;text-align:center}
.badge .nm{font-weight:700;font-size:16px}
.badge .how{font-size:14.5px;color:var(--ink-2)}
.badge.no .nm,.badge.no .ic{opacity:.4}
.road-intro{font-family:var(--font-text);font-size:16px;line-height:1.45;color:var(--ink-2);max-width:62ch;margin:6px 0 0}
.road h3{display:flex;align-items:baseline;gap:8px;font-family:var(--font-text);font-weight:500;font-size:21px;margin-top:20px;padding-bottom:5px;border-bottom:1px solid var(--ink)}
.road h3 span{margin-left:auto;font-family:var(--font-ui);font-size:14.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.road .stage-desc{font-size:14.5px;color:var(--ink-2);margin-top:6px}
.road ul{list-style:none;margin:4px 0 0;padding:0}
.road li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;column-gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:16px}
.road li .tick{text-align:center;font-weight:700;color:var(--ink-3)}
.road li.done{color:var(--ink-2)} .road li.done .tick{color:var(--good)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:center;background:var(--paper);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:220px;text-align:center;padding:12px 4px 13px;font-weight:600;font-size:16px;color:var(--ink-3);position:relative}
.tabs button[aria-current="true"]{color:var(--ink)}
.tabs button[aria-current="true"]::before{content:"";position:absolute;left:22%;right:22%;top:-1.5px;height:3px;background:var(--blaze)}
.tabs .n{font-size:12px;font-weight:700;color:var(--blaze-text);margin-left:3px;vertical-align:super}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--sheet);border-top:3px solid var(--ink);box-shadow:var(--shadow);padding:18px 20px calc(18px + env(safe-area-inset-bottom));animation:rise .22s ease}
.sheet.danger{border-top-color:var(--blaze)}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;align-items:baseline;gap:10px}
.sh-head .ic{font-size:24px;line-height:1}
.sh-head h2{font-family:var(--font-text);font-weight:500;font-size:25px;line-height:1.15}
.sh-head .dur{margin-left:auto;font-size:14px;color:var(--ink-3);white-space:nowrap}
.sh-nav{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 8px}
.story{margin-top:10px}
.story p{font-family:var(--font-text);font-size:17.5px;line-height:1.5;margin-top:8px;max-width:62ch}
.gains{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gain{font-size:14.5px;font-weight:600;padding:3px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--paper)}
.gain.minus{color:var(--ink-2);font-weight:500}
.deltas{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;font-size:14.5px;color:var(--ink-2)}
.deltas b{font-variant-numeric:tabular-nums}
.deltas .dn{color:var(--bad)} .deltas .up{color:var(--good)}
.news{margin-top:14px;font-size:15px;border-top:1px solid var(--rule);padding-top:10px}
.news p{padding:2px 0}
.news b{font-weight:700}
.encounter{margin-top:16px;border-top:1.5px solid var(--blaze);padding-top:12px}
.encounter .what{display:flex;align-items:baseline;gap:10px}
.encounter .what span{font-size:26px}
.encounter h3{font-family:var(--font-text);font-weight:600;font-size:22px}
.encounter p{font-family:var(--font-text);font-size:17.5px;line-height:1.5;margin-top:6px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:block;width:100%;padding:11px 14px;border:1.5px solid var(--ink);border-radius:2px}
.opt b{display:block;font-size:17px}
.opt span{display:block;font-size:14.5px;color:var(--ink-2);margin-top:1px}
.opt:hover{background:var(--ink);color:var(--paper)}
.opt:hover span{color:inherit;opacity:.8}
.sheet .foot{margin-top:18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet .foot .btn{padding:10px 22px;font-size:16px}
.sheet .foot .link{margin-right:auto;align-self:center}
.death{margin-top:14px;border-top:1.5px solid var(--ink);padding-top:12px}
.death .big{font-family:var(--font-text);font-size:30px;line-height:1.15}
.death p{font-family:var(--font-text);font-size:17px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:12px;font-size:15px}
.statgrid div{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:4px 0}
.statgrid b{font-variant-numeric:tabular-nums}
.menu-list{margin-top:8px}
.menu-list button{display:block;width:100%;padding:13px 2px;border-bottom:1px solid var(--rule);font-size:17px;font-weight:600}
.menu-list button span{display:block;font-size:14.5px;font-weight:400;color:var(--ink-2)}
textarea{width:100%;min-height:120px;margin-top:10px;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--rule);padding:8px;border-radius:2px}
.help p{font-family:var(--font-text);font-size:16.5px;line-height:1.5;margin-top:10px;max-width:62ch}
.help b{font-family:var(--font-ui);font-size:16px}
.why{font-size:14.5px;color:var(--warn);margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:3px;font-size:15.5px;max-width:min(92vw,520px);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .15s ease}
.toast.top{top:calc(14px + env(safe-area-inset-top));bottom:auto}

/* ---------- title screen ---------- */
#title{max-width:640px;margin:0 auto;padding:22px 20px 60px}
#title .plate{border:1.5px solid var(--ink);overflow:hidden;background:var(--map-paper)}
#title h1{font-family:var(--font-text);font-weight:400;font-style:italic;font-size:clamp(54px,15vw,92px);line-height:.92;letter-spacing:-.035em;margin-top:20px}
#title .by{font-size:17px;font-weight:600;color:var(--ink-2);margin-top:10px}
#title .lede{font-family:var(--font-text);font-size:18.5px;line-height:1.5;margin-top:16px;max-width:34em}
.optset{margin-top:22px}
.optset > p{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choice button{padding:9px 13px;border:1.5px solid var(--rule);border-radius:2px;font-size:16px;font-weight:600;line-height:1.2;height:100%}
.choice button span{display:block;font-size:14px;font-weight:400;color:var(--ink-2);margin-top:2px}
.choice button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (min-width:700px){.optset:first-of-type .choice{grid-template-columns:repeat(4,minmax(0,1fr))}}
.startbtns{margin-top:28px;display:grid;gap:10px}
.startbtns .btn{padding:14px 18px;font-size:18px;white-space:normal}
.best{margin-top:14px;font-size:15px;color:var(--ink-2)}

@media (max-width:899px){
  #game[data-panel="pack"] .stage,#game[data-panel="craft"] .stage,#game[data-panel="journal"] .stage{display:none}
}
@media (max-width:359px){
  .vitals{gap:6px} .v .lab{font-size:13px}
  .hud .wx{font-size:14px}
}
@media (min-width:900px){
  #game{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:28px;padding:0 20px 60px}
  .hud{grid-column:1/-1;padding:12px 0 10px}
  .vitals{gap:18px}
  .stage{grid-column:1;grid-row:2/4;position:sticky;top:112px;align-self:start;padding:8px 0 0;display:flex;flex-direction:column}
  .stage-bar{order:-1;padding:0 0 8px}
  .stage[data-view] #scene,.stage[data-view] .mapwrap{display:block}
  .stage-art .mapwrap{border-top:1.5px solid var(--ink)}
  .viewseg{display:none}
  .world{max-height:max(230px,calc(100vh - 430px))}
  .tabs{position:static;grid-column:2;grid-row:2;border-top:0;border-bottom:1.5px solid var(--ink);justify-content:flex-start;margin-top:6px}
  .tabs button{flex:none;padding:14px 18px 12px}
  .tabs button[aria-current="true"]::before{top:auto;bottom:-1.5px;left:18px;right:18px}
  .panel{grid-column:2;grid-row:3;padding:14px 2px 40px}
  .filters{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap}
  .toast{bottom:28px}
}
/* A wide but short window (a small laptop) has to fit the picture and the whole map at once, so the picture gives back its extra sky. */
@media (min-width:900px) and (max-height:860px){
  #scene{aspect-ratio:600/220;overflow:hidden}
  #scene .landscape{margin-top:-6.667%}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
