<script>
/* ===== 3. ENGINE ===== */

/* THE CLEARING: game engine. Pure logic, no DOM, so it can be tested headlessly. */
(function (root, D) {
'use strict';
const E = {};
const RES_MAX = 30000;   // kcal of body reserve per person before starvation hits hard
const HYD_L = 7.5;       // liters of body water a person can lose before it turns deadly
E.RES_MAX = RES_MAX; E.HYD_L = HYD_L;

/* ---------- seeded random numbers, so a saved game keeps its own dice ---------- */
function rnd(s){ s.rng = (s.rng + 0x6D2B79F5) >>> 0; let t = s.rng; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const chance = (s, p) => rnd(s) < p;
const rr = (s, a, b) => a + (b - a) * rnd(s);
const ri = (s, a, b) => Math.floor(rr(s, a, b + 1));
const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
function gauss(s){ let u = 0; while (!u) u = rnd(s); const v = rnd(s); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r2 = x => Math.round(x * 100) / 100;
const r3 = x => Math.round(x * 1000) / 1000;
function wpick(s, arr, wf){
  let tot = 0; const ws = new Array(arr.length);
  for (let i = 0; i < arr.length; i++){ const w = Math.max(0, wf(arr[i])); ws[i] = w; tot += w; }
  if (tot <= 0) return -1;
  let r = rnd(s) * tot;
  for (let i = 0; i < ws.length; i++){ r -= ws[i]; if (r <= 0) return i; }
  return ws.length - 1;
}
function shuffle(s, arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd(s) * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---------- time and date ---------- */
const CUM = [0]; for (let i = 0; i < 12; i++) CUM.push(CUM[i] + D.MONTH_DAYS[i]);
const dayIdx = t => Math.floor(t / 24 + 1e-9);
const hourOf = t => t - 24 * dayIdx(t);
function dateOf(s, di){
  const x = s.doy0 + di; const y = Math.floor(x / 365); const doy = x - 365 * y;
  let m = 0; while (m < 11 && doy >= CUM[m + 1]) m++;
  return {m, d: doy - CUM[m] + 1, doy, y};
}
const today = s => dateOf(s, dayIdx(s.t));
const monthNow = s => today(s).m;
function isDark(s){ const h = hourOf(s.t), m = monthNow(s); return h < D.SUNRISE[m] - 0.4 || h > D.SUNSET[m] + 0.4; }
function isEvening(s){ const h = hourOf(s.t), m = monthNow(s); return h >= D.SUNSET[m] - 1.5 || h < D.SUNRISE[m]; }
function twilight(s){ const h = hourOf(s.t), m = monthNow(s); return Math.abs(h - D.SUNRISE[m]) < 1.75 || (h > D.SUNSET[m] - 2.25 && h < D.SUNSET[m] + 0.75); }
/* The moon keeps real time: one cycle every 29.53 days, counted from a new moon on January 1 of the first year.
   0 is new, 0.25 first quarter, 0.5 full, 0.75 last quarter. It comes from the date alone, so old saves have one too. */
const LUNATION = 29.530588;
function moonPhase(s){ const x = (s.doy0 + s.t / 24) % LUNATION; return r3((x < 0 ? x + LUNATION : x) / LUNATION) % 1; }
function inWin(doy, from, to){
  const A = CUM[from[0]] + from[1] - 1; let B = CUM[to[0]] + to[1] - 1; let x = doy;
  if (B < A){ B += 365; if (x < A) x += 365; }
  return x >= A && x <= B;
}
function clock(h){
  let hh = Math.floor(h + 1e-6), mm = Math.round((h - hh) * 60);
  if (mm >= 60){ hh++; mm = 0; }
  hh = hh % 24; const ap = hh >= 12 ? 'PM' : 'AM'; let h12 = hh % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + String(mm).padStart(2, '0') + ' ' + ap;
}
E.clock = clock;

/* ---------- weather (DFW normals with fronts, storms, and the odd ice storm) ---------- */
function genWx(s, di){
  const m = dateOf(s, di).m;
  let front = 0;
  if ([10, 11, 0, 1, 2].indexOf(m) >= 0 && chance(s, 0.12)) front = -rr(s, 10, 22);
  else if ([5, 6, 7].indexOf(m) >= 0 && chance(s, 0.1)) front = rr(s, 3, 7);
  const hi = Math.round(D.HI[m] + gauss(s) * 4.5 + front);
  const lo = Math.round(Math.min(hi - 8, D.LO[m] + gauss(s) * 4 + front * 0.8));
  let rain = null, sky;
  const pr = D.RAIN_DAYS[m] / 30 * (s.world && s.world.dry > 25 ? 0.5 : 1);
  if (chance(s, pr)){
    const mm = Math.max(1, Math.round(-Math.log(1 - rnd(s)) * 13));
    const storm = m >= 2 && m <= 9 && mm >= 12 && chance(s, 0.55);
    const start = ri(s, 0, 23);
    const dur = Math.max(1, Math.round(storm ? rr(s, 1, 4) : rr(s, 2, 9)));
    let kind = storm ? 'storm' : 'rain';
    if (lo <= 31 && [11, 0, 1].indexOf(m) >= 0) kind = chance(s, 0.4) ? 'snow' : 'ice';
    rain = {mm, start, dur, kind};
    sky = kind;
  } else sky = chance(s, 0.5) ? 'clear' : (chance(s, 0.6) ? 'partly' : 'cloudy');
  return {hi, lo, rain, sky, spill: 0};
}
function rainNow(s, t){
  const h = hourOf(t), w = s.wx.today;
  if (w.spill > 0 && h < w.spill && s.wx.prevRain) return s.wx.prevRain;
  if (w.rain && h >= w.rain.start && h < w.rain.start + w.rain.dur) return w.rain;
  return null;
}
function tempAt(s, t){
  const h = hourOf(t), w = s.wx.today, n = s.wx.next;
  let T;
  if (h < 6){ const x = (h + 8) / 14; T = s.wx.prevHi + (w.lo - s.wx.prevHi) * (1 - Math.cos(Math.PI * x)) / 2; }
  else if (h <= 16){ const x = (h - 6) / 10; T = w.lo + (w.hi - w.lo) * (1 - Math.cos(Math.PI * x)) / 2; }
  else { const x = (h - 16) / 14; T = w.hi + (n.lo - w.hi) * (1 - Math.cos(Math.PI * x)) / 2; }
  if (rainNow(s, t)) T -= (h > 8 && h < 19) ? 6 : 2;
  return T;
}
function rainedEarlierToday(s){ const w = s.wx.today; return !!(w.rain && hourOf(s.t) >= w.rain.start) || w.spill > 0; }

/* ---------- messages collected while time passes ---------- */
function msg(s, text){ if (s.msgs.indexOf(text) < 0) s.msgs.push(text); }
function unlock(s, key, R){
  if (!key || !D.GUIDE[key] || s.guide[key]) return;
  s.guide[key] = dayIdx(s.t) + 1;
  if (R) R.notes.push(key); else s.pendingNotes.push(key);
}
function ach(s, R, k){ if (!s.ach[k]){ s.ach[k] = dayIdx(s.t) + 1; if (R) R.ach.push(k); else s.pendingAch.push(k); } }

/* ---------- inventory ---------- */
function have(s, k){
  if (k === 'snares') return s.tools.snares;
  if (k in s.inv) return s.inv[k];
  if (k in s.gear) return s.gear[k];
  return 0;
}
function add(s, R, k, n){
  if (!n) return;
  if (k === 'snares') s.tools.snares = Math.max(0, s.tools.snares + n);
  else if (k in s.inv) s.inv[k] = Math.max(0, r2(s.inv[k] + n));
  else if (k in s.gear) s.gear[k] = Math.max(0, r2(s.gear[k] + n));
  else return;
  if (R){ const g = R.gains.find(x => x.k === k); if (g) g.n = r2(g.n + n); else R.gains.push({k, n}); }
}
function missing(s, need, planksOk){
  const out = [];
  for (const k in need){
    let h = have(s, k);
    if (k === 'poles' && planksOk) h += s.inv.planks;
    if (h < need[k] - 1e-9) out.push(k);
  }
  return out;
}
function consume(s, R, need, planksOk){
  for (const k in need){
    let n = need[k];
    if (k === 'poles' && planksOk){ const p = Math.min(s.inv.planks, n); if (p > 0) add(s, R, 'planks', -p); n -= p; }
    if (n > 0) add(s, R, k, -n);
  }
}
function capacity(s){ return s.tools.bags * 5 + (s.tools.bowl ? 3 : 0) + (s.tools.pot ? 6 : 0) + (s.tools.rain ? 20 : 0); }

/* ---------- food lots ---------- */
const FISH = {sunfish:1, bass:1, catfish:1, gar:1};
function spoilMult(s){ const w = s.wx.today, mean = (w.hi + w.lo) / 2; return mean > 82 ? 0.6 : mean > 68 ? 1 : mean > 50 ? 1.6 : 2.6; }
function cachedFood(s, lot){ return !!s.tools.cache && !lot.rack && ['fresh','raw','cooked'].indexOf(lot.st) >= 0; }
function woodHours(s){ return s.tools.hearth ? 6 : 4; }
function exploreHours(s){ return s.tools.lookout ? 1.5 : 2; }
function lotName(lot){
  const F = D.FOODS[lot.key];
  if (lot.st === 'smoked') return FISH[lot.key] ? 'Smoked ' + F.name.toLowerCase() : F.name + ' jerky';
  if (lot.st === 'dried') return 'Dried ' + F.name.toLowerCase();
  if (lot.st === 'cooked') return 'Cooked ' + F.name.toLowerCase();
  return F.name;
}
E.lotName = lotName;
function addFood(s, R, key, kg, st){
  const F = D.FOODS[key]; kg = r2(kg); if (!F || kg < 0.01) return null;
  st = st || (F.cook ? 'raw' : 'fresh');
  const kcal = Math.round(kg * 10 * F.kcal);
  const exp = s.t + F.spoil * 24 * spoilMult(s);
  let lot = s.food.find(f => f.key === key && f.st === st && !f.rack && Math.abs(f.exp - exp) < 8);
  if (lot){ lot.kg = r2(lot.kg + kg); lot.kcal += kcal; lot.exp = Math.min(lot.exp, exp); }
  else { lot = {id: s.nid++, key, kg, kcal, st, exp, rack: null}; s.food.push(lot); }
  if (R){ const g = R.gains.find(x => x.food === key); if (g){ g.kg = r2(g.kg + kg); g.kcal += kcal; } else R.gains.push({food: key, kg, kcal}); }
  if (F.g) unlock(s, F.g, R);
  return lot;
}
// after part of a lot is eaten, raided, or used: crumbs go, anything left keeps a weight you can see
function trimLot(s, lot){
  if (lot.kcal < 5 || lot.kg <= 0){ const i = s.food.indexOf(lot); if (i >= 0) s.food.splice(i, 1); return; }
  if (lot.kg < 0.01) lot.kg = 0.01;
}
function kcalOf(s, key){ return s.food.filter(f => f.key === key).reduce((a, f) => a + f.kcal, 0); }

/* ---------- body ---------- */
function foodPct(s){ return s.body.res / RES_MAX * 100; }
function perf(s){
  const f = foodPct(s), w = s.body.hyd, e = s.body.en;
  let p = 1;
  p *= f >= 80 ? 1 : f >= 55 ? 0.93 : f >= 30 ? 0.85 : f > 0 ? 0.75 : 0.6;
  p *= w >= 60 ? 1 : w >= 40 ? 0.93 : w >= 20 ? 0.82 : 0.65;
  p *= e >= 40 ? 1 : e >= 20 ? 0.9 : 0.75;
  if (s.cond.sick > 0) p *= 0.85;
  if (s.cond.venom > 0) p *= 0.8;
  if (s.cond.protein > 0) p *= 0.9;
  return p;
}
E.perf = perf;
function yieldM(s){ return perf(s) * (s.P > 1 ? 1.8 : 1) * (s.opt.diff === 'easy' ? 1.15 : 1); }
function dmgM(s){ return s.opt.diff === 'easy' ? 0.6 : 1; }
function hurt(s, amt, cause){
  if (s.dead || amt <= 0) return;
  s.body.hp -= amt;
  for (const k in s.dmg) s.dmg[k] *= 0.97;
  s.dmg[cause] = (s.dmg[cause] || 0) + amt;
  if (s.body.hp <= 0){
    s.body.hp = 0; s.dead = true;
    let best = cause, bv = -1;
    for (const k in s.dmg) if (s.dmg[k] > bv){ bv = s.dmg[k]; best = k; }
    s.cause = best; s.deathT = s.t;
  }
}
function insulation(s, work, ctx){
  const atCamp = s.loc === 'camp';
  let v = work === 'heavy' ? 0.4 : work === 'moderate' ? 0.25 : work === 'light' ? 0.1 : 0;
  if (atCamp && (work === 'sleep' || work === 'rest' || (ctx && ctx.camp))){
    v += [0, 0.3, 0.45, 0.7][s.shelter];
    if (s.tools.bedding && work === 'sleep') v += 0.1;
  }
  if (s.tools.blanket && (work === 'sleep' || work === 'rest')) v += 0.2;
  if (atCamp){ if (s.fire.st === 'lit') v += 0.25; else if (s.fire.st === 'banked') v += 0.05; }
  return Math.min(0.95, v);
}
function coldStress(s, work, ctx){ return Math.max(0, 50 - tempAt(s, s.t)) * (1 - insulation(s, work, ctx)) * (1 + 0.8 * s.cond.wet); }
function sleepQ(s){
  const atCamp = s.loc === 'camp';
  let q = 0.42;
  if (atCamp){ q += [0, 0.22, 0.33, 0.43][s.shelter]; if (s.tools.bedding) q += 0.1; }
  const rain = rainNow(s, s.t);
  if (rain && !(atCamp && s.shelter >= 1)) q -= 0.25;
  const T = tempAt(s, s.t), ins = insulation(s, 'sleep');
  if (T < 55) q -= Math.max(0, (55 - T) / 60) * (1 - ins);
  if (T > 85) q -= 0.1;
  if (s.cond.rash > 0) q -= 0.18;
  if (s.cond.sick > 0) q -= 0.15;
  if (s.cond.venom > 0) q -= 0.15;
  if (foodPct(s) < 30) q -= 0.08;
  if (s.body.hyd < 30) q -= 0.08;
  if (s.cond.wet > 0.5) q -= 0.1;
  return clamp(q, 0.1, 1);
}
E.sleepQ = sleepQ;

function stepBody(s, dt, work, ctx){
  const b = s.body, c = s.cond;
  const T = tempAt(s, s.t);
  const rain = rainNow(s, s.t);
  const atCamp = s.loc === 'camp';
  const covered = atCamp && s.shelter >= 1 && (ctx.camp || work === 'sleep' || work === 'rest');
  // wet or dry
  if (rain && !covered){
    if (c.wet < 0.9 && !s.flags.soaked){ s.flags.soaked = true; msg(s, rain.kind === 'snow' ? 'Snow soaks through your clothes.' : 'The rain soaks you to the skin.'); }
    c.wet = 1;
  } else if (ctx.wading) c.wet = Math.max(c.wet, 0.6);
  else if (c.wet > 0){
    const h = hourOf(s.t), m = monthNow(s);
    const day = h > D.SUNRISE[m] && h < D.SUNSET[m];
    let dr = 0.12;
    if (day && !rain && s.wx.today.sky !== 'cloudy' && T > 65) dr += 0.2;
    if (atCamp && s.fire.st === 'lit') dr += 0.35;
    if (T < 45) dr *= 0.6;
    c.wet = Math.max(0, c.wet - dr * dt);
  }
  // water lost per person per hour
  let wl = {sleep: 0.045, rest: 0.09, light: 0.11, moderate: 0.15, heavy: 0.22}[work] || 0.11;
  if (T > 85) wl *= T > 100 ? 1.9 : T > 95 ? 1.6 : 1.3;
  if (c.sick > 0) wl += 0.09;
  if (c.protein > 0) wl += 0.04;
  b.hyd = clamp(b.hyd - wl / HYD_L * 100 * dt, 0, 100);
  // calories burned per person per hour (Dagr's 15 bars a day = about 2,250 kcal)
  let kc = 70.8 + ({sleep: -10, rest: 5, light: 25, moderate: 60, heavy: 110}[work] || 25);
  const cs = coldStress(s, work, ctx);
  if (cs > 0) kc += Math.min(60, cs * 2);
  if (c.sick > 0) kc += 10;
  b.res = Math.max(0, b.res - kc * dt);
  // energy
  let de;
  if (work === 'sleep') de = 12 * sleepQ(s);
  else if (work === 'rest') de = 5;
  else de = -({light: 3, moderate: 5, heavy: 8}[work] || 3);
  if (de > 0){ if (c.sick > 0) de *= 0.6; if (c.venom > 0) de *= 0.6; if (c.protein > 0) de *= 0.8; if (b.res <= 0) de *= 0.6; }
  else { if (c.wet > 0.5 && T < 60) de *= 1.15; if (T > 95) de *= 1.25; }
  b.en = clamp(b.en + de * dt, 0, 100);
  // damage
  const dm = dmgM(s);
  if (b.hyd <= 0) hurt(s, 3.5 * dt, 'dehydration');
  else if (b.hyd < 15) hurt(s, 0.4 * dt, 'dehydration');
  if (b.res <= 0) hurt(s, 0.3 * dt, 'starvation');
  else if (b.res < RES_MAX * 0.1) hurt(s, 0.08 * dt, 'starvation');
  if (cs > 0) hurt(s, cs / 40 * 0.9 * dt * dm, 'hypothermia');
  if (T > 95 && (work === 'moderate' || work === 'heavy') && b.hyd < 40) hurt(s, 0.8 * dt * dm, 'heat');
  if (c.sick > 0) hurt(s, 0.08 * dt, 'illness');
  if (c.venom > 0) hurt(s, (c.venomT < 12 ? 0.35 : 0.05) * dt * dm, 'venom');
  if (s.dead) return;
  // healing
  const fine = c.sick <= 0 && c.venom <= 0 && b.res > RES_MAX * 0.55 && b.hyd > 50 && cs < 1;
  if (fine) b.hp = Math.min(100, b.hp + (work === 'sleep' ? 0.3 * sleepQ(s) : work === 'rest' ? 0.12 : 0.03) * dt);
  // conditions tick down
  if (c.inc > 0){
    c.inc -= dt;
    if (c.inc <= 0){
      c.inc = 0; c.sick = rr(s, 72, 144) * (s.opt.diff === 'easy' ? 0.7 : 1);
      msg(s, 'Stomach cramps, fever, and diarrhea: a gut infection, almost certainly from untreated water. Drink extra, rest, and ride it out.');
      unlock(s, 'giardia', null);
    }
  }
  if (c.sick > 0){ c.sick = Math.max(0, c.sick - dt); if (c.sick === 0) msg(s, 'The gut infection has finally passed.'); }
  if (c.venom > 0){ c.venom = Math.max(0, c.venom - dt); c.venomT += dt; if (c.venom === 0) msg(s, 'The snakebite swelling is finally going down.'); }
  if (c.rash > 0){ c.rash = Math.max(0, c.rash - dt); }
  if (c.sprain > 0){ c.sprain = Math.max(0, c.sprain - dt); }
  if (c.protein > 0){ c.protein = Math.max(0, c.protein - dt); }
}

/* ---------- wildlife run on Dagr's evolution rules ---------- */
function meanW(ind){ if (!ind.length) return 0.8; let t = 0; for (const x of ind) t += x[0]; return t / ind.length; }
function dens(s, k){ const e = s.eco[k]; if (!e) return 1; return clamp(Math.pow(e.ind.length / D.SPECIES[k].start, 0.6), 0, 1.3); }
function aware(s, k){ const e = s.eco[k]; if (!e) return 1; return Math.pow(0.8 / Math.max(0.3, meanW(e.ind)), 2); }
function harvest(s, k){
  const e = s.eco[k]; if (!e || !e.ind.length) return false;
  const j = wpick(s, e.ind, x => Math.pow(1 / x[0], 6)); // the least wary get caught first
  if (j < 0) return false;
  e.ind.splice(j, 1); e.taken++;
  return true;
}
function ecoTick(s, m){
  let born = 0, good = 0, bad = 0; const parts = [];
  for (const k in D.SPECIES){
    const sp = D.SPECIES[k], e = s.eco[k], ind = e.ind;
    const nd = Math.round(ind.length * sp.mort * rr(s, 0.7, 1.3));
    for (let i = 0; i < nd && ind.length > 2; i++){ const j = wpick(s, ind, x => Math.pow(1 / x[0], 1.5)); if (j >= 0) ind.splice(j, 1); }
    let nb = 0;
    if (sp.breed.indexOf(m) >= 0 && ind.length >= 2){
      const n = Math.round(ind.length * sp.litter * Math.max(0, 1 - ind.length / sp.cap) * rr(s, 0.7, 1.3));
      for (let i = 0; i < n; i++){
        const par = ind[Math.floor(rnd(s) * ind.length)];
        let w = par[0], ms = par[1];
        if (chance(s, 0.10)){                   // Dagr's rule: a 1 in 10 chance of a mutation
          const g = chance(s, 0.25);            // Dagr's rule: 25% of mutations are good
          if (chance(s, 0.2)) ms = clamp(ms * (g ? 1.3 : 0.8), 0.01, 0.2); // the mutation stat itself can mutate
          else w = clamp(w + (g ? 1 : -1) * ms * rr(s, 0.5, 1.5), 0.3, 3);
          if (g){ e.good++; good++; } else { e.bad++; bad++; }
        }
        ind.push([r3(w), r3(ms)]); nb++;
      }
    }
    if (sp.immig){ const ni = Math.round(ind.length * sp.immig); for (let i = 0; i < ni && ind.length < sp.cap; i++) ind.push([r3(clamp(0.8 + gauss(s) * 0.1, 0.3, 3)), 0.05]); }
    born += nb;
    if (nb > 0) parts.push(nb + ' ' + sp.name.toLowerCase());
    e.hist.push([dayIdx(s.t), ind.length, r3(meanW(ind))]);
    if (e.hist.length > 40) e.hist.shift();
  }
  let t = D.MONTH_FULL[m] + ' wildlife report: ';
  t += born ? parts.slice(0, 4).join(', ') + ' born.' : 'no births this month.';
  if (good + bad) t += ' Dagr\'s rules at work: ' + (good + bad) + ' mutations (' + good + ' good, ' + bad + ' bad). See Journal, then Wildlife.';
  msg(s, t);
}

/* ---------- ripening crops ---------- */
function cropWin(c){ const A = CUM[c.start[0]] + c.start[1] - 1; let B = CUM[c.end[0]] + c.end[1] - 1; if (B < A) B += 365; return [A, B]; }
function seasonTotal(s, k){
  if (k === 'pecan'){
    const r = rnd(s);
    s.world.mast = r < 0.3 ? 'poor' : r < 0.7 ? 'fair' : 'bumper';
    return s.world.mast === 'poor' ? 25 : s.world.mast === 'fair' ? 70 : 150;
  }
  return D.CROPS[k].total * rr(s, 0.75, 1.25);
}
function cropDay(s, doy){
  for (const k in D.CROPS){
    const c = D.CROPS[k], st = s.crops[k];
    const [A, B] = cropWin(c);
    let x = doy; if (x < A && B >= 365) x += 365;
    st.ripe *= (1 - c.decay);
    if (x >= A && x <= B){
      const len = B - A + 1, pos = x - A;
      if (pos === 0 || st.season <= 0) st.season = seasonTotal(s, k);
      const mid = len / 2, u = pos + 0.5;
      const pdf = u <= mid ? (2 / len) * (u / mid) : (2 / len) * ((len - u) / (len - mid));
      st.ripe += st.season * Math.max(0, pdf);
    } else st.season = 0;
    if (st.ripe < 0.01) st.ripe = 0;
  }
}

/* ---------- the clock: everything that happens while time passes ---------- */
function pass(s, hours, work, R, ctx){
  ctx = ctx || {};
  let left = hours;
  while (left > 1e-6 && !s.dead){
    const dt = Math.min(0.25, left); left -= dt;
    const d0 = dayIdx(s.t);
    s.t = Math.round((s.t + dt) * 1000) / 1000;
    if (dayIdx(s.t) !== d0) newDay(s);
    stepBody(s, dt, work, ctx);
    if (s.dead) break;
    stepCamp(s, dt);
    stepNight(s, dt);
    spoilCheck(s);
  }
}

function stepCamp(s, dt){
  const f = s.fire, rain = rainNow(s, s.t);
  if (f.st === 'lit'){
    f.fuel -= dt;
    if (rain && s.shelter < 2){
      const p = (rain.kind === 'storm' ? 0.6 : rain.kind === 'rain' ? 0.3 : 0.4) * (s.shelter === 1 ? 0.4 : 1);
      if (chance(s, 1 - Math.pow(1 - p, dt))){ f.st = 'out'; f.fuel = 0; msg(s, 'The rain drowned your fire. A roof over the boulders would protect it.'); }
    }
    if (f.st === 'lit' && f.fuel <= 0){ f.st = 'out'; f.fuel = 0; msg(s, 'Your fire burned down to cold ash.'); }
  } else if (f.st === 'banked'){
    if (rain && s.shelter < 1) f.wet = true;
  }
  for (const lot of s.food){
    // Storage slows the food's existing clock; it never refreshes a lot or rescues spoiled food.
    if (cachedFood(s, lot) && lot.exp > s.t - dt) lot.exp += dt * 0.5;
    if (!lot.rack) continue;
    const r = lot.rack; let prog = 0;
    if (r.need === 'smoke'){ if (f.st === 'lit' && !(rain && s.shelter < 2)) prog = dt; }
    else {
      const h = hourOf(s.t), m = monthNow(s);
      const sun = !rain && h > D.SUNRISE[m] + 1 && h < D.SUNSET[m] - 1 && s.wx.today.sky !== 'cloudy';
      prog = sun ? dt : (f.st === 'lit' ? dt * 0.5 : 0);
    }
    if (prog > 0){ r.prog += prog; lot.exp += prog * 0.85; }
    if (rain && s.shelter < 2 && r.prog > 0 && chance(s, 0.1 * dt)) r.prog = Math.max(0, r.prog - 2);
    if (r.prog >= r.req){
      lot.st = r.need === 'smoke' ? 'smoked' : 'dried';
      lot.exp = s.t + (r.need === 'smoke' ? 30 : 60) * 24;
      lot.rack = null;
      msg(s, lotName(lot) + ' is done on the rack. It will keep for weeks.');
      ach(s, null, 'jerky');
    }
  }
  if (s.pot.stage === 'drying'){
    s.pot.dried += dt;
    if (s.pot.dried >= 72){ s.pot.stage = 'dry'; msg(s, 'Your clay pot is bone dry and ready to fire (Craft tab).'); }
  }
  if (s.tools.rain && rain && rain.kind !== 'snow'){
    const room = capacity(s) - s.water.clean - s.water.raw;
    if (room > 0){
      s.water.clean = r2(s.water.clean + Math.min(room, rain.mm / rain.dur * 12.5 * dt));
      if (!s.flags.rainNote){ s.flags.rainNote = true; msg(s, 'Rain is running into your catcher. Rainwater is safe to drink.'); }
    }
  }
}

function stepNight(s, dt){
  const h = hourOf(s.t);
  if (!(h >= 20.5 || h < 5.5)) return;
  const k = dt / 9;
  const pn = p => 1 - Math.pow(1 - clamp(p, 0, 0.99), k);
  const m = monthNow(s);
  if (s.trap.set && s.world.flood <= 0 && s.trap.catch.length < 8){
    let p = (s.trap.bait ? 0.75 : 0.5) * dens(s, 'riverfish') * Math.sqrt(aware(s, 'riverfish')) * (s.opt.diff === 'easy' ? 1.2 : 1) * (s.P > 1 ? 1.6 : 1);
    if ([11, 0, 1].indexOf(m) >= 0) p *= 0.45;
    if (chance(s, pn(p))) trapCatch(s);
  }
  if (s.snare.set && s.tools.snares > 0 && s.snare.catches.length < s.tools.snares){
    const sp = s.snare.loc === 'prairie' ? 'rabbit' : (chance(s, 0.5) ? 'rabbit' : 'squirrel');
    const each = 0.09 * dens(s, sp) * aware(s, sp) * (s.opt.diff === 'easy' ? 1.4 : 1);
    const p = 1 - Math.pow(1 - clamp(each, 0, 0.9), s.tools.snares - s.snare.catches.length);
    if (chance(s, pn(p)) && harvest(s, sp)){
      s.snare.catches.push({sp, t: s.t});
      if (chance(s, 0.1)) s.snare.broke = (s.snare.broke || 0) + 1;
    }
  }
  if (h >= 22 || h < 5) raidCheck(s, dt / 7);
}

function trapCatch(s){
  const n = 1 + (chance(s, 0.4) ? 1 : 0) + (chance(s, 0.15) ? 1 : 0);
  for (let i = 0; i < n && s.trap.catch.length < 8; i++){
    if (!harvest(s, 'riverfish')) break;
    const r = rnd(s), cat = s.trap.bait ? 0.35 : 0.2;
    const key = r < 0.5 ? 'sunfish' : r < 0.5 + cat ? 'catfish' : 'bass';
    const kg = key === 'sunfish' ? rr(s, 0.05, 0.1) : key === 'catfish' ? rr(s, 0.4, 1.0) : rr(s, 0.3, 0.7);
    s.trap.catch.push({key, kg: r2(kg)});
  }
  s.trap.bait = false;
}

function raidCheck(s, frac){
  const nightId = dayIdx(s.t - 12);
  if (s.world.raidNight === nightId) return;
  const lots = s.food.filter(f => f.kcal > 0);
  if (!lots.length) return;
  const m = monthNow(s);
  const smelly = lots.some(f => D.FOODS[f.key].meat && f.st !== 'smoked');
  const fruit = lots.some(f => f.st === 'fresh');
  let p = smelly ? 0.4 : fruit ? 0.25 : 0.12;
  if (s.fire.st === 'lit') p *= 0.5; else if (s.fire.st === 'banked') p *= 0.8;
  if (s.shelter >= 3) p *= 0.5;
  if (s.opt.diff === 'easy') p *= 0.6;
  const wolves = s.world.carcass > 0 && s.fire.st !== 'lit' && smelly;
  const r = rnd(s);
  const who = wolves && r < 0.5 ? 'wolves' : r < 0.45 ? 'raccoon' : r < 0.7 ? 'opossum' : (m >= 4 && m <= 9 && r > 0.92) ? 'bear' : 'coyote';
  const rackLots = lots.filter(f => f.rack), stored = lots.filter(f => !f.rack);
  const prot = s.tools.hang ? 0.12 : (who !== 'bear' && s.gear.crates > 0) ? 0.35 : 1;
  const pRack = rackLots.length ? p * (s.fire.st === 'lit' ? 0.5 : 1.3) : 0;
  const pStore = stored.length ? p * prot : 0;
  const pAny = 1 - (1 - pRack) * (1 - pStore);
  if (!chance(s, 1 - Math.pow(1 - clamp(pAny, 0, 0.95), frac))) return;
  s.world.raidNight = nightId;
  const pool = (rackLots.length && chance(s, pRack / Math.max(1e-6, pRack + pStore))) ? rackLots.slice() : stored.slice();
  if (!pool.length) return;
  const n = who === 'bear' ? 2 : 1, lost = [];
  for (let i = 0; i < n && pool.length; i++){
    const j = wpick(s, pool, f => (D.FOODS[f.key].meat ? 3 : 1) * (f.st === 'smoked' || f.st === 'dried' ? 0.5 : 1));
    if (j < 0) break;
    const f = pool[j]; pool.splice(j, 1);
    const capKg = {raccoon: 1.5, opossum: 1, coyote: 3, wolves: 9, bear: 14}[who];
    const fr = Math.min(who === 'bear' ? 1 : rr(s, 0.35, 1), capKg / Math.max(0.01, f.kg));
    const kc = Math.round(f.kcal * fr);
    lost.push(lotName(f).toLowerCase() + ' (' + kc + ' Cal)');
    f.kg = r2(f.kg * (1 - fr)); f.kcal -= kc;
    trimLot(s, f);
  }
  const txt = {raccoon: 'A raccoon raided your food in the night', opossum: 'An opossum got into your food in the night',
    coyote: 'Coyotes crept into camp in the night', bear: 'A black bear raided camp in the night',
    wolves: 'Wolves, drawn by the smell of the carcass, came into camp in the night'}[who];
  msg(s, txt + ' and got away with ' + lost.join(' and ') + '.' + (s.tools.hang ? '' : ' A food hang would keep it out of reach.'));
  if (who !== 'opossum') unlock(s, who === 'wolves' ? 'wolf' : who, null);
  if (who === 'wolves' && s.loc === 'camp' && s.shelter < 3 && chance(s, 0.12)){
    hurt(s, rr(s, 10, 18) * dmgM(s), 'mauled');
    msg(s, 'One wolf came too close and bit you before you drove it off with a burning stick.');
  }
}

function spoilCheck(s){
  for (let i = s.food.length - 1; i >= 0; i--){
    const f = s.food[i];
    if (s.t >= f.exp){ s.food.splice(i, 1); msg(s, lotName(f) + ' spoiled: ' + f.kcal + ' Calories wasted.'); }
  }
}

function newDay(s){
  const di = dayIdx(s.t);
  const old = s.wx.today;
  const end = old.rain ? old.rain.start + old.rain.dur : 0;
  s.wx.prevHi = old.hi;
  s.wx.prevRain = old.rain;
  s.wx.today = s.wx.next;
  s.wx.today.spill = end > 24 ? end - 24 : 0;
  s.wx.next = genWx(s, di + 1);
  const big = old.rain && old.rain.mm >= 30 && old.rain.kind !== 'snow';
  if (old.rain) s.world.dry = 0; else s.world.dry++;
  if (big){ s.world.flood = 2; floodHits(s); } else if (s.world.flood > 0) s.world.flood--;
  const date = dateOf(s, di);
  cropDay(s, date.doy);
  const st = s.stock;
  st.woodC += 0.8; st.woodO += 2; st.woodK += 2; st.yucca += 0.4; st.poles += 0.12;
  if (old.rain && old.rain.kind === 'storm'){ st.woodC += 3; st.woodO += 6; st.woodK += 6; }
  if (old.rain && old.rain.kind === 'ice'){ st.woodO += 12; st.woodK += 12; msg(s, 'The ice storm snapped branches all over the woods. Plenty of firewood now.'); }
  st.woodC = Math.min(35, st.woodC); st.woodO = Math.min(70, st.woodO); st.woodK = Math.min(70, st.woodK);
  st.yucca = Math.min(50, st.yucca); st.poles = Math.min(45, st.poles);
  const y = s.day;
  if (y.kcal >= 800 && y.lean / y.kcal >= 0.75) s.leanDays++;
  else if (y.kcal === 0 || y.lean / y.kcal < 0.5){ s.leanDays = 0; s.flags.leanWarn = false; }
  if (s.leanDays >= 3 && s.cond.protein <= 0){
    s.cond.protein = 48; s.leanDays = 0;
    msg(s, 'Nausea, headache, and diarrhea. Days of eating mostly lean meat have given you protein poisoning, the old trappers\' "rabbit starvation." Eat fat or starch: pecans, bars, cattail roots, raccoon, or bear.');
    unlock(s, 'rabbit', null);
  }
  s.day = {kcal: 0, lean: 0};
  if (date.d === 1) ecoTick(s, date.m);
  if (s.world.bison > 0) s.world.bison--;
  else if (chance(s, [10, 11, 0, 1, 2, 3].indexOf(date.m) >= 0 ? 0.06 : 0.02)){
    s.world.bison = ri(s, 2, 6); s.world.bisonId++;
    msg(s, 'A low rumble from the east: a bison herd has moved onto the prairie.');
  }
  if (s.world.pigeons > 0) s.world.pigeons--;
  else if ([9, 10, 11, 0, 1, 2].indexOf(date.m) >= 0 && chance(s, 0.035)){
    s.world.pigeons = ri(s, 1, 3); s.world.pigeonId++;
    msg(s, 'Passenger pigeons! A flock miles long is pouring overhead and roosting in the woods.');
  }
  if (s.world.carcass > 0) s.world.carcass--;
  if (s.world.wolvesAway > 0) s.world.wolvesAway--;
  if (date.d === 1 && D.SEASON_OF[date.m] !== D.SEASON_OF[(date.m + 11) % 12]) msg(s, D.SEASON_OF[date.m] + ' has arrived.');
}

function floodHits(s){
  msg(s, 'After the heavy rain, the river is up, fast and brown.');
  if (s.trap.set && chance(s, 0.35)){
    s.trap = {set: false, bait: false, catch: [], at: 0}; s.tools.fishtrap = false;
    msg(s, 'The flood tore your fish trap loose and carried it off. You\'ll have to weave a new one.');
  }
}

/* ---------- starting a game ---------- */
E.newGame = function(opt){
  opt = opt || {};
  const start = D.STARTS[opt.start] ? opt.start : 'spring';
  const st = D.STARTS[start];
  const duo = opt.party === 'duo';
  const seed = (opt.seed != null ? opt.seed : Math.floor(Math.random() * 4294967295)) >>> 0;
  const s = {
    v: 1, seed, rng: seed,
    opt: {party: duo ? 'duo' : 'solo', rations: opt.rations === 'shared' ? 'shared' : 'each', diff: opt.diff === 'easy' ? 'easy' : 'real', start},
    P: duo ? 2 : 1,
    doy0: CUM[st.m] + st.d - 1,
    t: 0, t0: 0, loc: 'camp',
    body: {hp: 100, hyd: 96, res: RES_MAX, en: 92},
    cond: {wet: 0, inc: 0, sick: 0, venom: 0, venomT: 0, rash: 0, sprain: 0, protein: 0},
    inv: {poles: 0, planks: 0, bark: 0, wood: 0, vines: 0, cord: 0, yucca: 0, fiber: 0, grass: 0, stones: 0, clay: 0, cane: 0, grubs: 0, hides: 0, feathers: 0, stave: 0, arrows: 0},
    gear: {crates: 2, tarp: 50, knives: 2, rounds: 50, laces: 2, bars: duo && opt.rations !== 'shared' ? 200 : 100},
    tools: {bowdrill: false, spear: false, fishtrap: false, snares: 0, rack: false, bowl: false, pot: false, bags: 0, rain: false, hang: false, bedding: false, blanket: false, bow: false, club: false, seep: false, workbench: false, woodstore: false, cache: false, hearth: false, lookout: false},
    shelter: 0,
    fire: {st: 'out', fuel: 0, at: 0, wet: false},
    water: {clean: 0, raw: 0, risk: 0},
    food: [], nid: 1,
    trap: {set: false, bait: false, catch: [], at: 0},
    snare: {set: false, loc: null, catches: [], broke: 0},
    pot: {stage: 'none', dried: 0, tries: 0},
    proj: {},
    skill: {fireOK: 0, fireFail: 0, spear: 0},
    found: {spring: false, osage: false, trail: false},
    visited: {camp: true},
    guide: {}, ach: {},
    world: {dry: 0, flood: 0, bison: 0, bisonId: 0, pigeons: 0, pigeonId: 0, carcass: 0, wolvesAway: 0, scare: {}, mast: 'fair', raidNight: -99},
    stock: {poles: 45, woodC: 35, woodO: 70, woodK: 70, yucca: 50, stones: 80},
    crops: {}, eco: {}, wx: null,
    day: {kcal: 0, lean: 0}, leanDays: 0,
    stats: {kcal: 0, bars: 0, fish: 0, game: 0, cleanL: 0, rawL: 0, fires: 0},
    flags: {}, msgs: [], pendingNotes: [], pendingAch: [], log: [], pending: null,
    dead: false, cause: null, deathT: 0, dmg: {}, startSeason: D.SEASON_OF[st.m]
  };
  s.t = s.t0 = Math.round((D.SUNRISE[st.m] + 0.5) * 4) / 4;
  s.wx = {today: null, next: null, prevHi: 0, prevRain: null};
  s.wx.today = genWx(s, 0); s.wx.next = genWx(s, 1); s.wx.prevHi = s.wx.today.hi - 3;
  if (s.wx.today.rain && s.wx.today.rain.start < 12) s.wx.today.rain.start = 14; // no soaking before breakfast on day 1
  for (const k in D.CROPS) s.crops[k] = {ripe: 0, season: 0};
  for (let di = -100; di <= 0; di++) cropDay(s, dateOf(s, di).doy);
  for (const k in D.SPECIES){
    const sp = D.SPECIES[k], ind = [];
    for (let i = 0; i < sp.start; i++) ind.push([r3(clamp(0.8 + gauss(s) * 0.12, 0.4, 3)), 0.05]);
    const w0 = r3(meanW(ind));
    s.eco[k] = {ind, w0, hist: [[0, ind.length, w0]], good: 0, bad: 0, taken: 0};
  }
  if ([10, 11, 0, 1, 2, 3].indexOf(st.m) >= 0 && chance(s, 0.3)){ s.world.bison = ri(s, 2, 5); s.world.bisonId = 1; }
  if ([9, 10, 11, 0, 1, 2].indexOf(st.m) >= 0 && chance(s, 0.15)){ s.world.pigeons = ri(s, 1, 2); s.world.pigeonId = 1; }
  return s;
};

E.intro = function(s){
  const st = D.STARTS[s.opt.start];
  const who = s.P > 1 ? 'You and your partner wake' : 'You wake';
  return [
    who + ' up in a wide clearing in North Texas. It is ' + D.MONTH_FULL[st.m] + ' ' + st.d + '. No roads, no fences, no contrails. In this world, humans never existed.',
    'Dagr\'s rules: real-world physics, and survive as long as you can.',
    'Your kit: two wooden crates, two 5-by-5-meter tarps, ' + s.gear.bars + ' ration bars (about 150 Calories each; 15 a day just keeps a person even), two boning knives, and a rifle with 50 rounds.',
    'Water is the first problem. The river is a short walk south of the boulders, but untreated water is a gamble.'
  ];
};

/* ---------- results ---------- */
function snapshot(s){ return {hp: s.body.hp, hyd: s.body.hyd, food: foodPct(s), en: s.body.en, t: s.t}; }
function newR(title, icon){ return {title, icon, lines: [], gains: [], notes: [], ach: [], delta: null}; }
function errR(text){ return {err: true, title: 'Not yet', icon: '✋', lines: [text], gains: [], notes: [], ach: []}; }
function begin(s){ s.flags.soaked = false; }
function checkAch(s, R){
  const days = (s.t - s.t0) / 24;
  if (days >= 7) ach(s, R, 'd7');
  if (days >= 30) ach(s, R, 'd30');
  if (days >= 365) ach(s, R, 'd365');
  if (D.SEASON_OF[monthNow(s)] !== s.startSeason && days > 3) ach(s, R, 'season');
  if (Object.keys(s.guide).length >= 25) ach(s, R, 'guide25');
  if (s.shelter >= 1) ach(s, R, 'roof');
  if (s.shelter >= 3) ach(s, R, 'hut');
  if (campUpgrades(s) >= 1) ach(s, R, 'camp1');
  if (campUpgrades(s) >= 5) ach(s, R, 'camp5');
  for (const k in s.eco){ const e = s.eco[k]; if (e.taken >= 3 && meanW(e.ind) >= e.w0 * 1.1){ ach(s, R, 'evolve'); break; } }
}
function finish(s, R, snap){
  if (s.msgs.length){ R.lines = R.lines.concat(s.msgs); s.msgs = []; }
  if (s.pendingNotes.length){ for (const k of s.pendingNotes) if (R.notes.indexOf(k) < 0) R.notes.push(k); s.pendingNotes = []; }
  if (s.pendingAch.length){ for (const k of s.pendingAch) if (R.ach.indexOf(k) < 0) R.ach.push(k); s.pendingAch = []; }
  if (!s.dead) checkAch(s, R);
  const now = snapshot(s);
  R.t0 = snap.t; R.t1 = s.t;
  R.delta = {hp: now.hp - snap.hp, hyd: now.hyd - snap.hyd, food: now.food - snap.food, en: now.en - snap.en};
  R.pending = !!s.pending; R.dead = !!s.dead;
  s.log.push({t: s.t, title: R.title, icon: R.icon, lines: R.lines.slice(0, 8)});
  if (s.log.length > 150) s.log.splice(0, s.log.length - 150);
  return R;
}

/* ---------- eating and drinking ---------- */
function gainKcal(s, each, lean){
  const abs = (s.cond.sick > 0 ? 0.7 : 1) * (s.cond.protein > 0 ? 0.8 : 1);
  s.body.res = Math.min(RES_MAX, s.body.res + each * abs);
  s.day.kcal += each; if (lean) s.day.lean += each;
  s.stats.kcal += each * s.P;
}
function infect(s, p){
  if (s.cond.sick > 0 || s.cond.inc > 0) return false;
  if (s.opt.diff === 'easy') p *= 0.4;
  if (chance(s, p)){ s.cond.inc = rr(s, 24, 60); return true; }
  return false;
}
const thirstNeed = s => (100 - s.body.hyd) / 100 * HYD_L;

E.eat = function(s, id){
  if (s.dead || s.pending) return null;
  const lot = s.food.find(f => f.id === id); if (!lot) return null;
  const F = D.FOODS[lot.key];
  if (lot.key === 'acornraw') return errR(F.raw);
  const room = RES_MAX - s.body.res;
  if (room < 60) return errR('You\'re full. Save it for later.');
  const left = 4500 - s.day.kcal;
  if (left < 60) return errR('You can\'t eat another bite today.');
  const per = Math.min(600, left, room + 150);
  const take = Math.min(lot.kcal, per * s.P);
  const snap = snapshot(s); begin(s);
  const R = newR('Eat', F.icon);
  const name = lotName(lot), wasRaw = F.cook && lot.st === 'raw';
  const fr = take / lot.kcal;
  lot.kg = r2(lot.kg * (1 - fr)); lot.kcal = Math.round(lot.kcal - take);
  trimLot(s, lot);
  const each = take / s.P;
  gainKcal(s, each, !!F.lean);
  R.lines.push((s.P > 1 ? 'You each eat' : 'You eat') + ' about ' + Math.round(each) + ' Calories of ' + name.toLowerCase() + '.');
  if (wasRaw){
    if (lot.key === 'elderberry'){
      if (chance(s, 0.5)){ s.cond.sick = Math.max(s.cond.sick, 10); R.lines.push('Raw elderberries turn your stomach. You feel awful for hours. Cook them next time.'); }
    } else { infect(s, lot.key === 'egg' ? 0.03 : 0.1); R.lines.push('Eating it raw was a gamble. Cooking kills parasites.'); }
  }
  if (F.lean && s.leanDays >= 1 && s.day.lean / Math.max(1, s.day.kcal) > 0.7 && !s.flags.leanWarn){
    s.flags.leanWarn = true;
    R.lines.push('Almost everything you\'ve eaten lately is lean meat. Your body needs fat or starch too.');
  }
  return finish(s, R, snap);
};

E.eatBars = function(s, n){
  if (s.dead || s.pending) return null;
  n = n || 1;
  const need = n * s.P;
  if (s.gear.bars < need) return errR(s.gear.bars ? 'Not enough bars left for that.' : 'The ration bars are gone.');
  if (RES_MAX - s.body.res < 60) return errR('You\'re full.');
  if (4500 - s.day.kcal < 60) return errR('You can\'t eat another bite today.');
  const snap = snapshot(s); begin(s);
  const R = newR('Ration bars', '🍫');
  add(s, R, 'bars', -need); s.stats.bars += need;
  gainKcal(s, n * D.BAR_KCAL, false);
  R.lines.push((s.P > 1 ? 'You each eat ' : 'You eat ') + n + ' bar' + (n > 1 ? 's' : '') + ' (' + n * D.BAR_KCAL + ' Calories). ' + s.gear.bars + ' bars left.');
  return finish(s, R, snap);
};

E.drink = function(s, which){
  if (s.dead || s.pending) return null;
  const need = thirstNeed(s);
  if (need < 0.1) return errR('You\'re not thirsty.');
  const pool = which === 'clean' ? s.water.clean : s.water.raw;
  if (pool < 0.05) return errR(which === 'clean' ? 'No clean water stored.' : 'No untreated water stored.');
  const each = Math.min(need, 1, pool / s.P);
  const snap = snapshot(s); begin(s);
  const R = newR('Drink', '💧');
  const tot = r2(each * s.P);
  if (which === 'clean'){ s.water.clean = Math.max(0, r2(s.water.clean - tot)); s.stats.cleanL += tot; ach(s, R, 'water'); }
  else {
    s.water.raw = Math.max(0, r2(s.water.raw - tot)); s.stats.rawL += tot;
    infect(s, 1 - Math.pow(1 - s.water.risk, each));
    if (s.water.raw < 0.01){ s.water.raw = 0; s.water.risk = 0; }
  }
  s.body.hyd = Math.min(100, s.body.hyd + each / HYD_L * 100);
  R.lines.push((s.P > 1 ? 'You each drink ' : 'You drink ') + each.toFixed(1) + ' liters of ' + (which === 'clean' ? 'clean' : 'untreated') + ' water.');
  return finish(s, R, snap);
};

function drinkSource(s, R, risk){
  pass(s, 0.25, 'rest', R); if (s.dead) return;
  const need = thirstNeed(s);
  if (need < 0.1){ R.lines.push('You\'re not thirsty, so you just splash your face.'); return; }
  s.body.hyd = 100;
  if (risk > 0){
    s.stats.rawL += need * s.P;
    infect(s, 1 - Math.pow(1 - risk, need));
    R.lines.push('You drink about ' + need.toFixed(1) + ' liters' + (s.P > 1 ? ' each' : '') + '. It tastes of mud and leaves.');
    if (!s.guide.giardia){ unlock(s, 'giardia', R); R.lines.push('Every sip of untreated water is a gamble: animals upstream shed giardia and bacteria into it. Boiled water, rain, and springs are safe.'); }
  } else {
    s.stats.cleanL += need * s.P; ach(s, R, 'water');
    R.lines.push('Cold, clean water. You drink about ' + need.toFixed(1) + ' liters' + (s.P > 1 ? ' each' : '') + '.');
  }
}
function fillSource(s, R, risk){
  pass(s, 0.25, 'light', R); if (s.dead) return;
  const cap = capacity(s);
  if (risk === 0 && s.water.raw > 0){ R.lines.push('You pour out the untreated water first.'); s.water.raw = 0; s.water.risk = 0; }
  const room = r2(cap - s.water.clean - s.water.raw);
  if (room <= 0.05){ R.lines.push('Your containers are already full.'); return; }
  if (risk === 0) s.water.clean = r2(s.water.clean + room);
  else { s.water.risk = (s.water.raw * s.water.risk + room * risk) / (s.water.raw + room); s.water.raw = r2(s.water.raw + room); }
  R.lines.push('You fill ' + room.toFixed(1) + ' liters' + (risk === 0 ? ' of clean water.' : ' of untreated water. Boil it at camp to make it safe.'));
}

/* ---------- sleeping ---------- */
E.sleep = function(s){
  if (s.dead || s.pending) return null;
  if (!isEvening(s)) return errR('It\'s not night yet. Rest instead.');
  const snap = snapshot(s); begin(s);
  const R = newR(s.loc === 'camp' ? 'Night at camp' : 'A night in the open', '🌙');
  const di = dayIdx(s.t), h = hourOf(s.t);
  const wakeDi = h < D.SUNRISE[monthNow(s)] ? di : di + 1;
  const wake = wakeDi * 24 + D.SUNRISE[dateOf(s, wakeDi).m] + 0.25;
  let qs = 0, qn = 0, left = wake - s.t;
  while (left > 1e-6 && !s.dead){
    const d = Math.min(1, left);
    qs += sleepQ(s) * d; qn += d;
    pass(s, d, 'sleep', R, {camp: s.loc === 'camp'});
    left -= d;
  }
  const q = qn ? qs / qn : 0.5;
  const head = s.dead ? [] : [q >= 0.8 ? 'You slept well.' : q >= 0.55 ? 'You slept on and off.' : 'A long, miserable night. You barely slept.'];
  R.lines = head.concat(s.msgs); s.msgs = [];
  if (!s.dead){
    const w = s.wx.today;
    R.lines.push('Morning. ' + skyWord(w.rain ? w.rain.kind : w.sky) + ' today, high near ' + w.hi + '°F.');
  }
  R.night = true;
  return finish(s, R, snap);
};
function skyWord(k){ return {clear: 'Clear skies', partly: 'Partly cloudy', cloudy: 'Overcast', rain: 'Rain', storm: 'Thunderstorms', snow: 'Snow', ice: 'Freezing rain'}[k] || 'Fair'; }
E.skyWord = skyWord;

/* ---------- walking ---------- */
function travelMins(s, k){
  const a = D.LOCS[s.loc], b = D.LOCS[k];
  let m = Math.max(10, Math.round(Math.hypot(a.x - b.x, a.y - b.y) * 0.28 / 5) * 5);
  if (s.cond.sprain > 0) m *= 1.6;
  if (isDark(s)) m *= 1.5;
  return Math.round(m);
}
E.travelList = function(s){
  return D.LOC_ORDER.filter(k => k !== s.loc && (!D.LOCS[k].hidden || s.found.spring))
    .map(k => ({id: k, name: D.LOCS[k].name, icon: D.LOCS[k].icon, mins: travelMins(s, k), visited: !!s.visited[k]}));
};
const FIRST = {
  cedar: ['cedar', 'The cedars are scattered, not a thick forest. Maybe three good poles per tree.'],
  oak: ['oak', 'Post oaks with leathery, cross-shaped leaves, and deadwood everywhere. These are the Cross Timbers.'],
  prairie: ['fireant', 'You sit down in the tall grass without a second thought. In our Texas you\'d check for fire ant mounds first. Here there aren\'t any.'],
  berry: ['honeybee', 'Native bees work the flowers: bumblebees, sweat bees, tiny carpenter bees. Not one honeybee. Those came from Europe with people.'],
  pond: ['gar', 'A long, toothy fish rises, gulps air with a pop, and sinks again: a gar.'],
  creek: ['hog', 'The bottomland soil is smooth and unbroken. In our Texas, feral hogs would have torn it all up. There are none here.'],
  spring: [null, 'The water is so cold it makes your teeth ache.']
};
E.travel = function(s, k){
  if (s.dead || s.pending || !D.LOCS[k] || k === s.loc) return null;
  if (D.LOCS[k].hidden && !s.found.spring) return null;
  const snap = snapshot(s); begin(s);
  const R = newR('Walk to ' + D.LOCS[k].name, D.LOCS[k].icon);
  const mins = travelMins(s, k), dark = isDark(s);
  pass(s, mins / 60, 'moderate', R);
  if (s.dead) return finish(s, R, snap);
  s.loc = k;
  R.lines.push('A ' + mins + '-minute walk' + (dark ? ' in the dark' : '') + '.');
  if (dark && s.cond.sprain <= 0 && chance(s, 0.06)){
    s.cond.sprain = 48; hurt(s, 4, 'wound');
    R.lines.push('In the dark you step in a hole and roll your ankle. Walking will be slow for a couple of days.');
  }
  if (!s.visited[k]){
    s.visited[k] = true;
    const f = FIRST[k];
    if (f){ if (f[0]) unlock(s, f[0], R); R.lines.push(f[1]); }
  }
  if (!s.dead) sightings(s, R);
  return finish(s, R, snap);
};

/* ---------- helpers for actions ---------- */
const A = [], AMAP = {};
function act(o){ A.push(o); AMAP[o.id] = o; }
function locMatch(a, loc){ return a.loc === '*' || a.loc === loc || (Array.isArray(a.loc) && a.loc.indexOf(loc) >= 0); }
function actHours(s, a){ return typeof a.h === 'function' ? a.h(s) : a.h; }
function lb(kg){ const x = kg * 2.2046; if (x < 1) return Math.max(1, Math.round(x * 16)) + ' oz'; return (x < 10 ? x.toFixed(1) : String(Math.round(x))) + ' lb'; }
E.lb = lb;
function stockWord(n, max){ return n >= max * 0.6 ? 'Plenty here.' : n >= max * 0.25 ? 'Getting picked over.' : n >= 1 ? 'Almost gone.' : 'Picked clean nearby, so you\'ll have to range far for it.'; }
function ago(s, t){ const h = s.t - t; if (h < 1) return 'just now'; if (h < 24) return Math.round(h) + ' h ago'; const d = Math.round(h / 24); return d + ' day' + (d > 1 ? 's' : '') + ' ago'; }
function cap1(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
function gatherWood(s, R, key, lo, hi, text){
  pass(s, 1, 'moderate', R); if (s.dead) return;
  if (s.stock[key] < 1){
    add(s, R, 'wood', s.P > 1 ? 2 : 1);
    R.lines.push('Everything close by is picked clean. You range far out and come back with ' + (s.P > 1 ? 'two armloads.' : 'a single armload.'));
    return;
  }
  const n = Math.min(Math.floor(s.stock[key]), Math.max(1, Math.round(rr(s, lo, hi) * yieldM(s))));
  s.stock[key] -= n; add(s, R, 'wood', n); R.lines.push(text);
}
function ivyCheck(s, R, p){
  if (s.cond.rash <= 0 && chance(s, p * (s.opt.diff === 'easy' ? 0.6 : 1))){
    s.cond.rash = rr(s, 96, 168); unlock(s, 'ivy', R);
    R.lines.push('Later your forearms start to itch and blister. Some of those vines were poison ivy. It will take about a week to clear up.');
  }
}
function bowstring(s){ return s.inv.fiber > 0 ? 'fiber' : s.inv.cord > 0 ? 'cord' : s.gear.laces > 0 ? 'laces' : null; }
function fireChance(s){
  let p = s.opt.diff === 'easy' ? 0.5 : 0.35;
  p += Math.min(0.45, 0.12 * s.skill.fireOK) + Math.min(0.2, 0.05 * s.skill.fireFail);
  p *= perf(s);
  if (!s.tools.woodstore){ if (rainNow(s, s.t)) p *= 0.7; else if (rainedEarlierToday(s)) p *= 0.85; }
  if (bowstring(s) === 'cord') p *= 0.9;
  if (s.P > 1) p = 1 - (1 - p) * (1 - p * 0.5);
  return clamp(p, 0.05, 0.95);
}
E.fireChance = fireChance;
function boilRate(s){ return (s.tools.pot ? 6 : 0) + (s.tools.bowl && s.inv.stones >= 4 ? 3 : 0); }
function rackable(s){ return s.food.filter(f => !f.rack && (f.st === 'raw' || f.st === 'cooked' || f.st === 'fresh') && (D.FOODS[f.key].meat || D.FOODS[f.key].dry)); }
function sleepHint(s){
  const q = sleepQ(s);
  if (s.loc !== 'camp') return 'No shelter out here. It will be a rough night.';
  const bits = [];
  if (!s.shelter) bits.push('no shelter');
  if (s.fire.st !== 'lit') bits.push('no fire'); else if (s.fire.fuel < 8) bits.push('the fire will burn out before dawn');
  return (q >= 0.8 ? 'Should be a good night.' : q >= 0.55 ? 'An okay night.' : 'A rough night ahead.') + (bits.length ? ' Heads up: ' + bits.join(', ') + '.' : '');
}
function thirsty(s){ return thirstNeed(s) < 0.1 ? 'You\'re not thirsty.' : true; }
function canFill(s){ const c = capacity(s); if (!c) return 'No containers yet. Fold a tarp water bag (Craft tab).'; if (s.water.clean + s.water.raw >= c - 0.05) return 'Your containers are full.'; return true; }

/* ---------- camp ---------- */
act({id: 'crate', loc: 'camp', name: 'Take apart a crate', icon: '📦', h: 1, work: 'moderate', dark: 'fire',
  show: s => s.gear.crates > 0,
  sub: s => s.gear.crates > 1 ? 'Ten planks for building. Keep one crate to protect your food.' : 'Your last crate is your only critter-proof food box.',
  run(s, R){
    pass(s, 1, 'moderate', R, {camp: true}); if (s.dead) return;
    add(s, R, 'crates', -1); add(s, R, 'planks', 10);
    R.lines.push('You pound the crate apart with a rock and pull the nails. Ten good planks.');
    if (!s.tools.club){ s.tools.club = true; R.lines.push('You keep one plank with the nails still sticking out. It makes a good snake club.'); }
    if (s.gear.crates === 0) R.lines.push('With no crate left, your food has no critter-proof box.');
  }});
act({id: 'firestart', loc: 'camp', name: 'Start a fire with the bow drill', icon: '🔥', h: 1, work: 'heavy', dark: 'ok',
  show: s => s.fire.st === 'out',
  can(s){
    if (!s.tools.bowdrill) return 'Carve a bow-drill kit first (Craft tab).';
    if (s.inv.bark < 1) return 'You need cedar bark for tinder.';
    if (s.inv.wood < 1) return 'You need firewood.';
    if (!bowstring(s)) return 'You need cordage or a bootlace for the bowstring.';
    if (rainNow(s, s.t) && s.shelter < 1) return 'Everything is soaked. Build a shelter to work under.';
    return true;
  },
  sub: s => 'About a ' + Math.round(fireChance(s) * 100) + '% chance. Uses bark, firewood, and a bowstring' + (bowstring(s) === 'laces' ? ' (a bootlace).' : '.'),
  run(s, R){
    const p = fireChance(s), str = bowstring(s);
    pass(s, 1, 'heavy', R, {camp: true}); if (s.dead) return;
    add(s, R, 'bark', -1);
    if (chance(s, p)){

function collectSnares(s, R){
  const got = [], lost = [];
  for (const c of s.snare.catches){
    if (s.t - c.t > 30){ lost.push(c.sp); continue; }
    const G = D.GAME[c.sp]; addFood(s, R, G.food, rr(s, G.kg[0], G.kg[1])); got.push(c.sp);
  }
  s.snare.catches = [];
  if (s.snare.broke){ add(s, R, 'snares', -s.snare.broke); s.snare.broke = 0; R.lines.push('One snare was snapped and ruined.'); }
  if (got.length){ s.stats.game += got.length; ach(s, R, 'hunt'); R.lines.push('Caught: ' + got.map(k => D.GAME[k].name).join(', ') + '.'); }
  if (lost.length) R.lines.push('Something got to ' + (lost.length > 1 ? lost.length + ' of your catches' : 'a catch') + ' before you did: just fur and bones.');
  if (!got.length && !lost.length) R.lines.push('Nothing yet. One loop is sprung and empty, so you reset it.');
  if (s.tools.snares <= 0) s.snare.set = false;
}

function ripeList(s){ return D.PICK.map(p => ({p, c: s.crops[p.crop], C: D.CROPS[p.crop]})).filter(o => o.c.ripe > 0.05); }
function ripeTotal(s){ return ripeList(s).reduce((a, o) => a + o.c.ripe, 0); }
function cropLabel(C){ return C.label || D.FOODS[C.food].name.toLowerCase(); }
function nextRipe(s){
  const doy = today(s).doy; let best = null, bd = 999;
  for (const p of D.PICK){ const C = D.CROPS[p.crop]; const a = CUM[C.start[0]] + C.start[1] - 1; const d = (a - doy + 365) % 365; if (d > 0 && d < bd){ bd = d; best = C; } }
  return best ? 'Next up: ' + (best.label ? 'early blackberries' : D.FOODS[best.food].name.toLowerCase()) + ' around ' + D.MONTHS[best.start[0]] + ' ' + best.start[1] + '.' : '';
}
function ripeLine(s){
  const L = ripeList(s);
  if (!L.length) return 'Nothing ripe. ' + nextRipe(s);
  return 'Ripe: ' + L.map(o => cropLabel(o.C) + ' (about ' + lb(o.c.ripe) + ')').join(', ') + '.';
}
act({id: 'pick', loc: 'berry', name: 'Pick berries', icon: '🫐', h: 1, work: 'light',
  can: s => ripeList(s).length ? true : 'Nothing ripe right now.',
  sub: s => ripeLine(s),
  run(s, R){
    pass(s, 1, 'light', R); if (s.dead) return;
    const ym = yieldM(s); let tl = 1, dagr = false, thorny = false;
    const L = ripeList(s).sort((a, b) => b.c.ripe - a.c.ripe);
    for (const o of L){
      if (tl <= 0.02) break;
      const rate = o.p.rate * ym, kg = Math.min(o.c.ripe * 0.8, rate * tl);
      if (kg < 0.03) continue;
      o.c.ripe -= kg; tl -= kg / rate;
      addFood(s, R, o.C.food, kg);
      if (o.p.crop === 'dagr') dagr = true;
      if (o.C.food === 'blackberry' || o.C.food === 'dewberry') thorny = true;
    }
    R.lines.push(L.length ? 'Purple fingers and a full shirt front.' : 'The birds beat you to it.');
    if (dagr && !s.flags.dagrNote){ s.flags.dagrNote = true; R.lines.push('Real blackberries here don\'t ripen until late May, but the DM ruled a few early ones into this thicket. The DM\'s word is law.'); }
    if (thorny && chance(s, 0.2)){ hurt(s, 1, 'wound'); R.lines.push('The thorns leave your arms scratched up.'); }
  }});
act({id: 'shake', loc: 'berry', name: 'Shake the mulberry over a tarp', icon: '🌳', h: 1, work: 'light',
  show: s => s.crops.mulberry.ripe > 0.5,
  can: s => s.gear.tarp < 10 ? 'You need a spare piece of tarp to catch the fruit.' : true,
  sub: s => 'About ' + lb(s.crops.mulberry.ripe) + ' of ripe fruit up in the tree. Much faster than picking.',
  run(s, R){
    pass(s, 1, 'light', R); if (s.dead) return;

/* ---------- foraging ---------- */
function forageNames(s, loc){
  const doy = today(s).doy, out = [];
  for (const f of D.FORAGE[loc] || []){
    if (!inWin(doy, f.from, f.to) || f.chance) continue;
    if (f.water){ out.push('grapevine water'); continue; }
    if (f.crop && s.crops[f.crop].ripe < 0.1) continue;
    const n = D.FOODS[f.food].name.toLowerCase();
    if (out.indexOf(n) < 0) out.push(n);
  }
  return out;
}
function forageSub(s, loc){ const L = forageNames(s, loc); return L.length ? 'In season: ' + L.join(', ') + '.' : 'Not much to find this time of year.'; }
function forage(s, R, loc, hours){
  pass(s, hours, 'light', R); if (s.dead) return;
  const doy = today(s).doy, ym = yieldM(s);
  let got = 0; const extra = [];
  const firstOnion = !s.guide.onion;
  for (const f of D.FORAGE[loc]){
    if (!inWin(doy, f.from, f.to)) continue;
    if (f.chance){ if (chance(s, f.chance)){ addFood(s, R, f.food, rr(s, f.kg[0], f.kg[1])); if (f.text) extra.push(f.text); got++; } continue; }
    if (f.water){ const L = f.rate * hours * rr(s, 0.7, 1.2); s.body.hyd = Math.min(100, s.body.hyd + L / HYD_L * 100); if (f.g) unlock(s, f.g, R); extra.push(f.text); continue; }
    let kg = f.rate * hours * ym * rr(s, 0.7, 1.25);
    if (f.crop){ const c = s.crops[f.crop]; kg = Math.min(kg, c.ripe * 0.8); c.ripe = Math.max(0, c.ripe - kg); }
    if (kg >= 0.05){ addFood(s, R, f.food, kg); got++; }
  }
  R.lines.push(got ? pick(s, ['You work slowly through the brush, filling your shirt.', 'An hour and a half of careful looking pays off.', 'You fill your pockets and the front of your shirt.']) : 'Slim pickings in this season.');
  for (const t of extra) R.lines.push(t);
  if (firstOnion && s.guide.onion) R.lines.push('Every onion gets the smell test first. Poisonous death camas looks just like it but has no onion smell.');
  if (loc === 'prairie' && !s.guide.dandelion && monthNow(s) >= 1 && monthNow(s) <= 4){ unlock(s, 'dandelion', R); R.lines.push('Spring flowers everywhere, but not a single dandelion. They came from Europe with people.'); }
}

/* ---------- exploring ---------- */
function explore(s, R, loc){
  pass(s, exploreHours(s), 'moderate', R); if (s.dead) return;
  if (s.tools.lookout) R.lines.push('The route you picked from the lookout saves half an hour.');
  if (!s.found.spring && chance(s, loc === 'oak' ? 0.3 : loc === 'prairie' ? 0.22 : 0.12)){
    s.found.spring = true;
    R.lines.push('Following a line of greener grass uphill, you find cold, clear water seeping from the base of a sandstone ledge. A spring! Spring water is safe to drink. It\'s on your map now.');
    return;
  }
  if (loc === 'creek' && !s.found.osage && chance(s, 0.45)){
    s.found.osage = true; unlock(s, 'osage', R);
    R.lines.push('A grove of thorny trees dropping bumpy green fruit the size of softballs: osage orange, bois d\'arc. The best bow wood there is. You can cut a stave here now.');
    return;
  }
  if (loc === 'oak' && !s.found.trail && chance(s, 0.4)){
    s.found.trail = true; unlock(s, 'deer', R);
    R.lines.push('A deer trail worn deep into the leaf litter, with antler rubs on the saplings. Hunting in the Oak Woods will be better now.');
    return;
  }
  const r = rnd(s);
  if (r < 0.3 && loc !== 'prairie'){ add(s, R, 'wood', 2); R.lines.push('Nothing new, but you come back with two armloads of good deadwood.'); }
  else if (r < 0.5){ add(s, R, 'grubs', ri(s, 2, 4)); R.lines.push('Nothing new, but a rotten log was full of fat grubs.'); }
  else R.lines.push(pick(s, ['Just more country: oaks, briars, and quiet.', 'You find old wolf scat full of hair and a turkey feather, but nothing useful.', 'You climb a rise and look out over miles of trees and grass. Not a road, not a fence, not one chimney. Nobody, anywhere.']));
}

/* ---------- hunting ---------- */
function canHunt(s){ return s.gear.rounds > 0 || (s.tools.bow && s.inv.arrows > 0) ? true : 'No rounds left, and no bow and arrows.'; }
function huntSub(s, loc){
  let t = twilight(s) ? 'Good timing: animals move most at dawn and dusk.' : 'Animals move most at dawn and dusk.';
  if ((s.world.scare[loc] || 0) > s.t) t += ' Game here is still spooked by your last shot.';
  if (loc === 'prairie' && s.world.bison > 0) t += ' The bison herd is here.';
  if (s.world.pigeons > 0 && loc !== 'prairie') t += ' Pigeons are roosting in the trees.';
  if (s.tools.lookout) t += ' Lookout: animal encounter chances ×1.25.';
  return t;
}
function huntRoll(s, loc, bigOnly){
  const h = hourOf(s.t);
  const tf = twilight(s) ? 1.6 : (h > 11 && h < 15 ? 0.6 : 1);
  const scare = (s.world.scare[loc] || 0) > s.t ? 0.35 : 1;
  const wet = rainNow(s, s.t) ? 0.75 : 1;
  const base = tf * scare * wet * Math.sqrt(perf(s)) * (s.P > 1 ? 1.35 : 1) * (s.opt.diff === 'easy' ? 1.15 : 1);
  const list = D.HUNT[loc].slice();
  if (s.world.pigeons > 0 && loc !== 'prairie') list.unshift(['pigeon', 0.7]);
  for (const [sp, p0] of list){
    const G = D.GAME[sp];
    if (bigOnly && G.small) continue;
    if (sp === 'bison' && s.world.bison <= 0) continue;
    let p = (sp === 'bison' || sp === 'pigeon') ? p0 * Math.min(1.2, base) : p0 * base;
    if (G.eco) p *= dens(s, G.eco) * aware(s, G.eco);
    if (sp === 'deer' && loc === 'oak' && s.found.trail) p *= 1.3;
    if (s.tools.lookout) p *= 1.25;
    if (chance(s, clamp(p, 0, 0.92))) return sp;
  }
  return null;
}
function huntGo(s, R, loc){
  pass(s, 2, 'moderate', R); if (s.dead) return;
  const sp = huntRoll(s, loc, false);
  if (!sp){ R.lines.push(pick(s, ['Two hours of stillness. Tracks, droppings, and birdsong, but nothing in range.', 'You ease along the trail, but whatever was here heard you first.', 'Nothing moves but the wind in the grass.'])); return; }
  s.pending = {type: 'hunt', sp, loc, waited: false};
  R.lines.push('Something moves. You freeze.');
}
const SPOT = {
  deer: 'A white-tailed doe steps out of the brush sixty yards away, ears swiveling.',
  turkey: 'A big gobbler struts along the tree line, three hens pecking behind him.',
  squirrel: 'A fox squirrel flicks its tail and chatters at you from an oak limb.',
  rabbit: 'A cottontail freezes in the grass twenty yards out.',
  raccoon: 'A fat raccoon waddles along a fallen log, busy with something.',
  bison: 'A young bison cow grazes at the edge of the herd, eighty yards out. The bulls are watching you.',
  pigeon: 'The flock is so thick that branches bend under the roosting pigeons.'
};
const KILL = {
  squirrel: 'A clean shot. Not much meat on a squirrel, but it counts.',
  rabbit: 'Got it. Rabbit is very lean: pair it with fat or starch.',
  turkey: 'A big gobbler. You pluck it and save the best feathers for arrows.',
  raccoon: 'A fat raccoon: rich, fatty meat and a good hide.',
  deer: 'A clean kill. Field dressing and butchering takes two hours. It\'s far more meat than you can eat before it spoils, so smoke it on a drying rack or lose most of it.',
  bison: 'The cow drops and the herd thunders off. Butchering takes the rest of your strength. You take all you can carry; the carcass will draw every wolf and coyote for miles.',
  pigeon: 'One shot into the roost brings down a handful of birds.'
};
function huntView(s){
  const p = s.pending, G = D.GAME[p.sp], o = [];
  if (s.gear.rounds > 0) o.push({k: 'shoot', label: 'Shoot', sub: s.gear.rounds + ' rounds left.'});
  if (s.tools.bow && s.inv.arrows > 0) o.push({k: 'arrow', label: 'Loose an arrow', sub: 'Quiet, so other game won\'t spook. Arrows sometimes break.'});
  if (G.small && !p.waited) o.push({k: 'wait', label: 'Wait for bigger game', sub: 'Another hour, still as a stump.'});
  o.push({k: 'pass', label: 'Let it go', sub: G.small ? 'Save the ammunition.' : ''});
  return {title: cap1(G.name), icon: D.FOODS[G.food].icon, text: SPOT[p.sp], opts: o};
}
function huntResolve(s, R, k){
  const p = s.pending; s.pending = null;
  const G = D.GAME[p.sp];
  if (k === 'pass'){ R.lines.push('You let it go.'); return; }
  if (k === 'wait'){
    pass(s, 1, 'moderate', R); if (s.dead) return;
    const sp2 = huntRoll(s, p.loc, true);
    if (sp2){ s.pending = {type: 'hunt', sp: sp2, loc: p.loc, waited: true}; R.lines.push('You wait, barely breathing. Then something bigger appears.'); }
    else R.lines.push('You wait a full hour. Nothing bigger shows.');
    return;
  }
  if (k === 'shoot' && s.gear.rounds < 1) return;
  if (k === 'arrow' && !(s.tools.bow && s.inv.arrows > 0)) return;
  let hit = (k === 'arrow' ? 0.58 : 0.84) * Math.sqrt(perf(s)) * Math.sqrt(G.eco ? aware(s, G.eco) : 1);
  if (p.sp === 'pigeon') hit = 0.95;
  if (k === 'shoot'){ add(s, R, 'rounds', -1); s.world.scare[p.loc] = s.t + 18; }
  else {
    s.world.scare[p.loc] = Math.max(s.world.scare[p.loc] || 0, s.t + 3);
    if (chance(s, 0.35)){ add(s, R, 'arrows', -1); R.lines.push('The arrow is lost in the brush.'); }
  }
  if (!chance(s, clamp(hit, 0.05, 0.97))){
    R.lines.push(k === 'shoot' ? 'The shot cracks across the land. A miss, and it\'s gone.' : 'The arrow hisses past. It bolts.');
    if (p.sp === 'bison' && chance(s, 0.2)){ hurt(s, rr(s, 15, 30) * dmgM(s), 'mauled'); R.lines.push('A bull swings toward you and charges! It clips you as you dive behind a tree.'); }
    return;
  }
  if (G.eco) harvest(s, G.eco);
  let kg = rr(s, G.kg[0], G.kg[1]);
  if (p.sp === 'bison'){ kg = s.P > 1 ? 70 : 40; s.world.carcass = 3; }
  if (p.sp === 'pigeon') kg = ri(s, 3, 8) * 0.15;
  pass(s, G.clean, G.clean >= 2 ? 'heavy' : 'moderate', R);
  addFood(s, R, G.food, kg);
  if (G.hides) add(s, R, 'hides', G.hides);
  if (G.feathers) add(s, R, 'feathers', G.feathers);
  s.stats.game++; ach(s, R, 'hunt');
  R.lines.push(KILL[p.sp]);
  if (p.sp === 'deer' && s.opt.party === 'solo' && !s.tools.rack) R.lines.push('Tip: a drying rack (Craft tab) turns meat into jerky that keeps for weeks.');
}

/* ---------- dangerous encounters ---------- */
const ENC = {

    if (s.water.raw < 0.01){ s.water.raw = 0; s.water.risk = 0; }
    addFood(s, R, 'acorn', kg);
    R.lines.push('You shell the acorns and boil them in change after change of water until it stays clear and the bitterness is gone. Roasted, they taste nutty.');

E.craft = function(s, id){
  const r = RMAP[id]; if (!r) return null;
  const st = recState(s, r);
  if (st.status === 'done') return errR('Already done.');
  if (st.status !== 'ok') return errR(st.why);
  const snap = snapshot(s); begin(s);
  const R = newR(r.name, r.icon);
  const tot = recTotal(s, r), ctx = {camp: s.loc === 'camp'};
  if (r.session){
    let pj = s.proj[r.id];
    if (!pj){ consume(s, R, r.need, r.planks); pj = s.proj[r.id] = {done: 0, total: tot}; }
    const h = r2(Math.min(r.session, pj.total - pj.done));
    pass(s, h, r.work, R, ctx);
    if (s.dead) return finish(s, R, snap);
    pj.done = r2(pj.done + h);
    if (pj.done >= pj.total - 0.01){ delete s.proj[r.id]; complete(s, R, r); }
    else R.lines.push('You work steadily for ' + h + ' hours. About ' + Math.round(pj.done / pj.total * 100) + '% done. Pick it up again whenever you like.');

    if (r.need) consume(s, R, r.need, r.planks);
    pass(s, tot, r.work, R, ctx);
    if (s.dead) return finish(s, R, snap);
    complete(s, R, r);
  }
  return finish(s, R, snap);
};

/* ---------- running actions ---------- */
function checkAct(s, a){
  if (s.dead) return 'Game over.';
  if (s.pending) return 'Decide what to do first.';
  const dark = isDark(s);
  if (a.dark === 'only' && !dark) return 'Only after dark.';
  if (dark && !a.dark) return 'Too dark. Wait for morning, or sleep.';
  if (dark && a.dark === 'fire' && !(s.loc === 'camp' && s.fire.st === 'lit')) return 'Too dark. You can work by firelight at camp.';
  if (a.work === 'heavy' && s.cond.venom > 0) return 'The snakebite swelling makes heavy work impossible.';
  if ((a.work === 'heavy' || a.work === 'moderate') && s.body.en < 6) return 'Too exhausted. Rest or sleep first.';
  if (a.can){ const c = a.can(s); if (c !== true) return c; }
  return true;
}
E.actions = function(s){
  return A.filter(a => locMatch(a, s.loc) && (!a.show || a.show(s))).map(a => {
    const ok = checkAct(s, a);
    return {id: a.id, name: typeof a.name === 'function' ? a.name(s) : a.name, icon: a.icon, h: actHours(s, a), work: a.work,
      ok: ok === true, why: ok === true ? '' : ok, sub: a.sub ? a.sub(s) : ''};

};
E.run = function(s, id){
  if (id === 'sleep') return E.sleep(s);
  const a = AMAP[id];
  if (!a || !locMatch(a, s.loc) || (a.show && !a.show(s))) return null;
  const ok = checkAct(s, a);
  if (ok !== true) return errR(ok);
  const snap = snapshot(s); begin(s);
  const R = newR(typeof a.name === 'function' ? a.name(s) : a.name, a.icon);
  a.run(s, R);
  if (!s.dead && !s.pending) rollHazards(s, a, R);
  return finish(s, R, snap);
};
E.pendingView = function(s){

E.choose = function(s, k){
  if (!s.pending || s.dead) return null;

const CAMP_UPGRADES = ['workbench', 'woodstore', 'cache', 'hearth', 'lookout'];

/* ---------- advice: one voice for "what should I do next?" ----------
   The screen turns {recipe}, {go, act}, {drink}, or {tab} into a button, so advice is always something you can act on.

  const meatKcal = fresh.filter(f => D.FOODS[f.key].meat).reduce((a, f) => a + f.kcal, 0);
  if (s.tools.rack && meatKcal >= 1500 * s.P){
    const f = s.fire.st === 'lit' ? null : fireStep(s);
    if (f) goal('You have more meat than you can eat before it spoils. Get the fire going, then smoke it on the drying rack.', f);
    else goal('You have more meat than you can eat before it spoils. Slice it onto the drying rack and keep the fire going: smoked, it keeps for weeks.', {go: 'camp', act: 'rack'});
  }
  if (soon.length){
    const f = s.fire.st === 'lit' ? null : fireStep(s);
    if (f) goal('Your catch will spoil soon, and it needs cooking. Get the fire going.', f);
    else goal('Your catch will spoil soon. Cook it at camp: cooked, it keeps about two days.', {go: 'camp', act: 'cook'});
  }
  if (s.food.some(f => f.rack && f.rack.need === 'smoke') && s.fire.st !== 'lit'){ const f = fireStep(s); if (f) goal('The meat on the rack needs smoke. Get the fire going again.', f); }
  if (s.tools.fishtrap && !s.trap.set && !flood){
    if (s.inv.grubs < 2 && s.loc === 'cedar') goal('Grubs make the fish trap catch far more. Dig some while you\'re here.', {go: 'cedar', act: 'grubs'});
    goal('Your fish trap only works in the water. Set it at the River Bank' + (s.inv.grubs >= 2 ? ', baited with grubs.' : '.'), {go: 'river', act: 'trapset'});
  }
  if (s.trap.set && s.t - s.trap.at > 14 && !flood) goal('Fish swim into the trap overnight. Go check it.', {go: 'river', act: 'trapcheck'});
  if (s.tools.snares > 0 && !s.snare.set) goal('Snares only catch rabbits once they\'re set. The Prairie has good runs.', {go: 'prairie', act: 'snareset'});
  if (s.snare.set && s.t - s.snare.at > 20) goal('Check your snare line before a coyote does.', {go: s.snare.loc, act: 'snarecheck'});

  if (s.crops.pecan.ripe > 2) goal('Pecans are down at the Creek Bottom: the richest wild food there is.', {go: 'creek', act: 'pecans'});
  // only worth gathering what you can leach: a bowl or pot, and a fire you can light, and not a pile already waiting
  const bitter = s.food.filter(f => f.key === 'acornraw').reduce((a, f) => a + f.kg, 0);
  if (s.crops.acorn.ripe > 8 && safeBoil && bitter < 3 * s.P && (s.fire.st === 'lit' || bowstring(s))) goal('Acorns are falling in the Oak Woods. Leached, they\'re a staple.', {go: 'oak', act: 'forage_oak'});

  if (armed && (lean || twilight(s) || h < D.SUNRISE[monthNow(s)] + 3)) goal((twilight(s) ? 'Game is moving right now.' : 'Hunting brings in more food than anything else, and dawn and dusk are the best times.') + ' Hunt the Oak Woods, and smoke what you can\'t eat in a day.', {go: 'oak', act: 'hunt_oak'});
  if (!lean) return;

// Keep a supply of safe water, so thirst never sends you to drink from the river.

/* THE CLEARING: the scene. A picture of where you are, drawn from the real game state.
   Nothing here is decoration for its own sake. The sun and the moon sit where the clock and the calendar put
   them, the light on the land follows the sky, the camp shows only what you have built, and animals appear
   only when the game says they are around. No game rules live here. Exposes window.Scene.

   It is painted as pixel art, the way The Hollow Stair paints its world. Every object is built from a few
   shaded shapes. Each pixel gets a light level from the shape's surface and from where the real sun or moon
   is, and the levels become color through five-step ramps whose shadows lean blue and highlights lean gold.

  }
  for (const [a, b, bend] of TRAILS) if (visibleLoc(a, s) && visibleLoc(b, s)) o.push(`<path class="trail" d="${trailPath(D.LOCS[a], D.LOCS[b], bend)}"/>`);
  o.push(campGlyph(s));

    const L = D.LOCS[k], off = LAB[k], dim = s && !s.visited[k];

  }
  if (s){
    const Y = D.LOCS[s.loc];
    o.push(`<circle class="ring" cx="${Y.x}" cy="${Y.y}" r="6"/><circle class="you" cx="${Y.x}" cy="${Y.y}" r="4"/>`);
    if (h && h.raining) o.push(weather(h));
    for (const k of D.LOC_ORDER){
      if (!visibleLoc(k, s)) continue;
      const L = D.LOCS[k];
      o.push(`<circle class="hit" role="button" tabindex="0" aria-label="${esc(L.name)}${k === s.loc ? ', where you are now' : ''}" data-loc="${k}" cx="${L.x}" cy="${L.y}" r="17"><title>${esc(L.name)}</title></circle>`);
    }

}
function weather(h){
  if (h.sky === 'snow'){
    let c = '';
    for (let y = -24, r = 0; y < 290; y += 12, r++) for (let x = (r % 2) * 7; x < 390; x += 14) c += `<circle cx="${x}" cy="${y}" r="1.1"/>`;
    return `<g class="weather slow"><g class="snow">${c}</g></g>`;
  }
  const step = h.sky === 'storm' ? 9 : 14; let l = '';
  for (let y = -24, r = 0; y < 290; y += 24, r++) for (let x = (r % 2) * step / 2; x < 396; x += step) l += `<line x1="${x}" y1="${y}" x2="${x - 3}" y2="${y + 8}"/>`;
  return `<g class="weather"><g class="rain">${l}</g></g>`;
}
function mapSeason(m){ return m === 9 || m === 10 ? 'fall' : (m === 11 || m <= 1) ? 'winter' : ''; }
/* When you walk somewhere, your dot walks there on the map too: along the worn trail if there is one,
   straight across country if not. It only runs while the map is on screen, and never for reduced motion. */
function walkOnMap(from, to){
  const dyn = $('#dyn'), wrap = $('#mapwrap');
  if (!dyn || !wrap || from === to || wrap.offsetParent === null) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const you = dyn.querySelector('.you'), ring = dyn.querySelector('.ring'); if (!you || !ring) return;
  const tr = TRAILS.find(t => (t[0] === from && t[1] === to) || (t[0] === to && t[1] === from));
  const A = D.LOCS[from], B = D.LOCS[to], back = !!tr && tr[0] !== from;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'walk');
  path.setAttribute('d', tr ? trailPath(D.LOCS[tr[0]], D.LOCS[tr[1]], tr[2]) : `M${A.x},${A.y} L${B.x},${B.y}`);
  dyn.insertBefore(path, ring);
  let total = 0; try { total = path.getTotalLength(); } catch (e) {}
  if (!total){ path.remove(); return; }
  const t0 = performance.now(), dur = 1300;
  const put = k => { const p = path.getPointAtLength(back ? total * (1 - k) : total * k); for (const el of [you, ring]){ el.setAttribute('cx', p.x.toFixed(1)); el.setAttribute('cy', p.y.toFixed(1)); } };
  put(0);
  const step = now => {
    if (!you.isConnected) return; // the map was redrawn under us; the new one already shows where you are
    const k = Math.min(1, (now - t0) / dur);
    put(k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
    if (k < 1) requestAnimationFrame(step); else { path.style.transition = 'opacity .6s'; path.style.opacity = '0'; setTimeout(() => path.remove(), 650); }
  };
  requestAnimationFrame(step);
}

<li class="row"><span class="ic">💧</span><div><div class="nm">Clean: ${w.clean.toFixed(1)} liters</div><div class="sub">Boiled, rain, or spring water. Safe to drink.</div></div><button type="button" class="btn" data-drink="clean"${w.clean >= 0.05 ? '' : ' disabled'}>Drink</button></li>
<li class="row"><span class="ic">🫙</span><div><div class="nm">Untreated: ${w.raw.toFixed(1)} liters</div><div class="sub${w.raw > 0 ? ' warn' : ''}">River or pond water. Boil it at camp, or take your chances.</div></div><button type="button" class="btn" data-drink="raw"${w.raw >= 0.05 ? '' : ' disabled'}>Drink</button></li>
</ul><p class="note">${w.cap ? 'Your containers hold ' + w.cap + ' liters.' : 'No containers yet. Fold a tarp water bag in the Craft tab.'}</p></div>`;
  const mats = Object.keys(D.MATS).filter(k => S.inv[k] > 0);
  h += '<div class="sect"><h3>Materials</h3>' + (mats.length ? '<div class="grid">' + mats.map(k => `<div><span>${D.MATS[k].icon}</span>${esc(D.MATS[k].name)}<b>${fmtN(S.inv[k])}</b></div>`).join('') + '</div>' : '<p class="note">Nothing yet. The Cedar Stand, the Prairie, and the River Bank have plenty.</p>') + '</div>';
  const t = S.tools, gear = [['📦', 'Wooden crates', S.gear.crates], ['🟦', 'Tarp', S.gear.tarp + ' m²'], ['🔪', 'Boning knives', S.gear.knives], ['🎯', 'Rifle rounds', S.gear.rounds], ['👟', 'Bootlaces', S.gear.laces]];
  const tools = [[t.bowdrill, '🔥', 'Bow drill'], [t.club, '🪚', 'Nailed plank'], [t.spear, '🔱', 'Fishing spear'], [t.fishtrap, '🧺', 'Fish trap'], [t.snares, '➰', 'Snares', t.snares], [t.bags, '🎒', 'Water bags', t.bags], [t.bowl, '🥣', 'Wooden bowl'], [t.pot, '🏺', 'Clay pot'], [t.rain, '🌧️', 'Rain catcher'], [t.rack, '🪜', 'Drying rack'], [t.hang, '🪢', 'Food hang'], [t.bedding, '🌾', 'Grass bed'], [t.blanket, '🐾', 'Hide blanket'], [t.bow, '🏹', 'Bois d\'arc bow'], [t.seep, '⛏️', 'Seep well']];
